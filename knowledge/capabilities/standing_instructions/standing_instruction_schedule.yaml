id: standing_instruction_schedule
status: approved_mvp
domain: standing_instructions
display_name: Standing Instruction Schedule
description: >-
  List standing instruction recurrence schedule configuration in authorized offices:
  recurrence type, frequency, interval, day, month, offset days, validity bounds, and last run date.
  Surfaces recorded schedule verbatim with no next-run computation.
  Governed by office authorization on either linked account path.
data_areas: [standing_instructions]
required_api_capability: standing_instruction_schedule
query_id: standing_instructions.standing_instruction_schedule
metrics: []
output_mode: list
request_shape: { operation: list, subject: standing_instruction_schedule, grouping: none, output: list, pii: none }
examples:
  - Show standing instruction schedule and recurrence.
  - List standing instruction recurrence configuration.
  - Tampilkan jadwal dan pola perulangan instruksi transfer otomatis.
supported_intents:
  - standing instruction schedule and recurrence
  - standing instruction recurrence configuration
guards:
  require_office_scope: true
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: office_scope_bounded
    rule: D05 listing is office-bounded across from_office_id and to_office_id in authorized scope.
  - id: no_next_run_computation
    rule: next-run computation is excluded; recurrence configuration is surfaced verbatim as recorded.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
