id: standing_instruction_executions
status: approved_mvp
domain: standing_instructions
display_name: Standing Instruction Executions
description: >-
  List standing instruction execution attempt history within an explicit date window:
  history ID, standing instruction ID, instruction name, status, execution time, amount, and error log.
  Governed by office authorization on either linked account path.
data_areas: [standing_instructions]
required_api_capability: standing_instruction_executions
query_id: standing_instructions.standing_instruction_executions
metrics: []
output_mode: list
request_shape: { operation: list, subject: standing_instruction_execution, grouping: none, output: list, pii: none }
examples:
  - Show standing instruction execution history.
  - List execution attempts for standing instructions.
  - Tampilkan riwayat eksekusi instruksi pembayaran otomatis.
supported_intents:
  - standing instruction execution history
  - standing instruction execution attempts
guards:
  require_office_scope: true
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: business_today - 12m }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: office_scope_bounded
    rule: D05 listing is office-bounded across from_office_id and to_office_id in authorized scope.
  - id: explicit_window_bounded
    rule: execution attempts are filtered by explicit date window.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
