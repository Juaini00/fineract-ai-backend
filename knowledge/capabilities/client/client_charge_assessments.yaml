id: client_charge_assessments
status: approved_mvp
domain: client
display_name: Client Charge Assessments
description: >-
  List direct client charge assessments overlapping a date window for authorized
  offices: client, charge, and office IDs, charge master currency, assessed amount,
  derived amounts (paid, waived, written off, outstanding), due date, timing and
  calculation enums, penalty and active flags. Stored derived amounts are recorded facts,
  never recomputed, and NULL stays NULL. Master charge definition is separated from
  actual assessment. A client with no assessed charges is not delinquent. No client names.
data_areas: [client_charges, organization_foundation]
required_api_capability: client_charge_assessments
query_id: client.client_charge_assessments
metrics: []
output_mode: list
request_shape: { operation: list, subject: client_charge_assessment, grouping: none, output: list, pii: none }
examples:
  - Show client charge assessments from January 2026 to March 2026.
  - List client charge assessments due this month in my authorized offices.
  - Tampilkan pembebanan biaya langsung client dari Januari 2026 sampai Maret 2026.
supported_intents:
  - list direct client charge assessments in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: master_not_actual
    rule: charge master (m_charge) is separated from actual assessment (m_client_charge); currency comes from m_charge.
  - id: no_delinquency_inference
    rule: absence of assessed charges is not delinquency; queries return only recorded assessments.
  - id: nullable_derived_not_zeroed
    rule: derived amounts (paid, waived, written off, outstanding) are returned as recorded and never coerced to zero.
  - id: per_currency_only
    rule: amounts are presented per-currency without cross-currency consolidation.
  - id: no_names_or_free_text
    rule: client names and free-text descriptions are never returned.
