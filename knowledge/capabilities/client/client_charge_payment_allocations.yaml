id: client_charge_payment_allocations
status: approved_mvp
domain: client
display_name: Client Charge Payment Allocations
description: >-
  List payment allocations recorded against client charges for a date window and authorized
  offices: allocation, charge, and transaction IDs, allocation amount, charge currency,
  transaction currency, transaction date, transaction type enum, reversal flag, client
  office ID, and transaction office ID. Allocation grain is the safe measure; transaction
  amounts are not summed to avoid fan-out. Reversals are surfaced, never silently netted.
  Office scope is the client's office; transaction office does not confer authorization.
data_areas: [client_charges, organization_foundation]
required_api_capability: client_charge_payment_allocations
query_id: client.client_charge_payment_allocations
metrics: []
output_mode: list
request_shape: { operation: list, subject: client_charge_payment_allocation, grouping: none, output: list, pii: none }
examples:
  - Show client charge payment allocations from January 2026 to March 2026.
  - List client charge payment allocations recorded this month.
  - Tampilkan alokasi pembayaran biaya client dari Januari 2026 sampai Maret 2026.
supported_intents:
  - list client charge payment allocations in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: allocation_amount_is_grain
    rule: allocation grain is one m_client_charge_paid_by row; amount is pb.amount, avoiding transaction sum fan-out.
  - id: per_currency_only
    rule: charge currency and transaction currency are surfaced separately; no cross-currency conversion or consolidation.
  - id: reversal_labeled_not_netted
    rule: transaction reversal status (is_reversed) is surfaced explicitly, never silently netted or filtered.
  - id: no_delinquency_inference
    rule: absence of payments does not infer delinquency; only recorded allocations are returned.
  - id: no_names_or_free_text
    rule: client names and free-text descriptions are never returned.
