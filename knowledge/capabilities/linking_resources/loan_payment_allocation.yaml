id: loan_payment_allocation
status: approved_mvp
domain: linking_resources
display_name: Loan Payment Allocation
description: >-
  List loan payment allocation portion breakdown per loan transaction: loan transaction ID,
  loan ID, office ID, transaction date, transaction type enum, transaction amount, principal portion,
  interest portion, fee charges portion, penalty charges portion, currency code, and reversed flag.
  Allocation-consistency contract asserts that portions sum to transaction amount. Loan side only;
  savings transactions are single-purpose with no multi-portion allocation equivalent.
  Account numbers and external IDs are never returned.
data_areas: [linking_resources]
required_api_capability: loan_payment_allocation
query_id: linking_resources.loan_payment_allocation
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_payment_allocation, grouping: none, output: list, pii: none }
examples:
  - Show loan payment allocation breakdown by portion.
  - List loan transaction principal, interest, fee, and penalty allocation.
  - Tampilkan alokasi pembayaran pinjaman per komponen.
supported_intents:
  - loan payment allocation component breakdown
guards:
  require_office_scope: true
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: allocation_consistency_contract
    rule: components sum to amount for multi-component allocations.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
