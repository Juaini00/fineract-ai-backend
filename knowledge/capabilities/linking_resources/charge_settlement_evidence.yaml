id: charge_settlement_evidence
status: approved_mvp
domain: linking_resources
display_name: Charge Settlement Evidence
description: >-
  List charge settlement evidence linking charges to their paying transactions: charge paid-by ID,
  savings account charge ID, savings account transaction ID, savings account ID, charge ID, settlement amount,
  paying transaction date, currency code, and authorized office ID. Settlement evidence is directly linked,
  never inferred from balance drops alone. Loan side has no explicit paid-by table (loan charge amounts
  paid/waived/outstanding are derived totals surfaced under LOAN-7 loan_charges).
  Account numbers and external IDs are never returned.
data_areas: [linking_resources]
required_api_capability: charge_settlement_evidence
query_id: linking_resources.charge_settlement_evidence
metrics: []
output_mode: list
request_shape: { operation: list, subject: charge_settlement, grouping: none, output: list, pii: none }
examples:
  - Show charge settlement evidence linking charges to transactions.
  - List savings charge payments and paying transaction links.
  - Tampilkan bukti pelunasan biaya dan transaksi pembayar.
supported_intents:
  - charge settlement evidence linking charges to paying transactions
guards:
  require_office_scope: true
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: settlement_evidence_direct
    rule: settlement evidence is direct and never inferred from balance changes.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
