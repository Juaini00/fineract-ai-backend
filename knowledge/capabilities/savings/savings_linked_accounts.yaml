id: savings_linked_accounts
status: approved_mvp
domain: savings
display_name: Savings Linked Accounts
description: >-
  List linked accounts and portfolio associations involving savings accounts: association ID,
  savings account ID, loan account ID, linked savings account ID, linked loan account ID,
  association type enum, active flag, client ID, and office ID. Association type enum maps to
  AccountAssociationType.java (INVALID=0, LINKED_ACCOUNT_ASSOCIATION=1,
  GUARANTOR_ACCOUNT_ASSOCIATION=2). Surfaces association linkage only, never proof of an
  executed transfer (transfer evidence remains under LINK-4 / FIN-130). Governed by client office.
  Account numbers and external IDs are never returned.
data_areas: [savings_core, organization_foundation]
required_api_capability: savings_linked_accounts
query_id: savings.savings_linked_accounts
metrics: []
output_mode: list
request_shape: { operation: list, subject: account_association, grouping: none, output: list, pii: none }
examples:
  - Show linked savings accounts and portfolio associations.
  - List account associations for savings in authorized offices.
  - Tampilkan rekening tabungan tertaut dan asosiasi portofolio.
supported_intents:
  - list linked savings accounts and portfolio associations
guards:
  require_office_scope: true
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: linkage_only_not_transfer
    rule: linkage existence is not proof of transfer.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
