id: savings_interest_position
status: approved_mvp
domain: savings
display_name: Savings Interest Position
description: >-
  List savings accounts interest positions: account ID, client ID, office ID, product ID,
  product name, currency code, nominal annual interest rate, interest compounding and
  posting period enums, interest calculation type enums, total interest earned derived,
  total interest posted derived, interest posted till date, last interest calculation date,
  and submitted date. Earned interest and posted interest remain distinct measures.
  Account numbers and external IDs are never returned.
data_areas: [savings_core, organization_foundation]
required_api_capability: savings_interest_position
query_id: savings.savings_interest_position
metrics: []
output_mode: list
request_shape: { operation: list, subject: savings_account, grouping: none, output: list, pii: none }
examples:
  - Show savings interest earned versus posted from November 2025 to April 2026.
  - List savings account interest positions for authorized offices.
  - Tampilkan posisi bunga tabungan yang diperoleh dibandingkan dengan yang dibukukan.
supported_intents:
  - list savings account interest earned versus posted positions
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: earned_distinct_from_posted
    rule: earned interest and posted interest are distinct measures.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
