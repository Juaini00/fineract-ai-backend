id: savings_transactions_by_type
status: approved_mvp
domain: savings
display_name: Savings Transactions by Type
description: >-
  Breakdown of savings transaction totals and counts by transaction type enum:
  currency code, transaction type enum, transaction count, and total amount.
  Exposes all savings transaction types beyond deposit/withdrawal, including interest posting,
  fees, charges, transfers, overdraft interest, holds, and releases.
  Types 1-21 are mapped per Fineract source; types 22-26 remain raw bigint without invented labels.
  Reversals are excluded by default. Amounts are kept per currency code without cross-currency summation.
data_areas: [savings_transactions, savings_core, organization_foundation]
required_api_capability: savings_transactions_by_type
query_id: savings.savings_transactions_by_type
metrics: []
output_mode: summary
request_shape: { operation: summary, subject: savings_transaction, grouping: transaction_type_enum, output: table, pii: none }
examples:
  - Show savings transactions breakdown by type from November 2025 to April 2026.
  - List savings transaction totals by type for authorized offices.
  - Tampilkan rincian transaksi tabungan berdasarkan tipe transaksi.
supported_intents:
  - breakdown savings transactions by transaction type
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: currency_per_code
    rule: currency is carried per code without cross-currency consolidation.
