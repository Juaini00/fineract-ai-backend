id: inter_office_cash_transfers
status: approved_mvp
domain: teller_cashier
display_name: Inter-Office Cash Transfers
description: >-
  List recorded cash transfers between offices for a date window, newest first:
  transfer, sending and receiving office IDs, date, amount, currency. Shown only
  when every office on it is authorized. Separate from teller or cashier cash.
  No descriptions. Empty means no recorded transfer in the window.
data_areas: [teller_cashier_ops, organization_foundation]
required_api_capability: inter_office_cash_transfers
query_id: teller_cashier.inter_office_cash_transfers
metrics: []
output_mode: list
request_shape: { operation: list, subject: office_cash_transfer, grouping: none, output: list, pii: none }
examples:
  - List the recorded cash transfers between my offices from January 2026 to June 2026.
  - Show inter-office cash transfers for this month.
  - Tampilkan transfer kas antar kantor dari Januari 2026 sampai Juni 2026.
supported_intents:
  - list recorded inter-office cash transfers
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: separate_from_teller_cash
    rule: m_office_transaction is read on its own; it is never summed with or joined to cashier movements.
