id: scheduler_job_run_history
status: approved_mvp
domain: scheduler
display_name: Scheduler Job Run History
description: >-
  Run history of ONE selected Fineract batch (scheduler) job in an explicit
  window: every attempt, successful and failed, one row per run, oldest first
  (ties by run id), with start, end, status, trigger type, whether the run is the
  job's latest run, and the job's latest run status overall (not filtered by the
  window). Use it to read failed attempts against the attempts that followed.
  The job is chosen from the approved job list, never typed as free text.
  Scheduler timestamps are timezone-naive; the window is half-open
  [from_date 00:00:00, to_date + 1 day 00:00:00) on the stored clock. A request must state its window as explicit dates on
  the stored clock; calendar words ("last night", "semalam") and timezone names
  are refused, never converted. A run
  status never proves that the business period or the accounts were covered. Raw
  error text is never returned. Tenant-wide operational data, not office-scoped.
data_areas: [scheduler_ops]
required_api_capability: scheduler_job_run_history
query_id: scheduler.job_run_history
metrics: []
output_mode: list
request_shape: { operation: list, subject: scheduler_job_run, grouping: none, output: list, pii: none }
examples:
  - Show the run history of the Apply penalty to overdue loans job from April 2026 to May 2026 on the stored clock, successful and failed attempts.
  - What happened after the failed runs of a batch job, did later attempts succeed?
  - Tampilkan riwayat run job batch Apply penalty to overdue loans, yang berhasil dan gagal, April 2026 sampai Mei 2026 pada jam tersimpan.
supported_intents:
  - list every run, successful and failed, of one selected scheduler job in an explicit window with the job's latest run status
guards:
  max_date_range_days: 366
  operational_tenant_wide: true
  pii: { returns_pii: false }
checks:
  - id: window_half_open
    rule: runs are selected with start_time >= from_date and start_time < to_date + 1 day on the stored naive clock.
  - id: both_outcomes
    rule: success and failed attempts are both returned for the selected job and window.
  - id: job_identity_resolved
    rule: job_id is bound only through the scheduler.jobs resolver (K1), never free text.
  - id: no_raw_errors
    rule: error_message and error_log are never selected.
parameters:
  job_id:
    type: integer
    required: true
    resolution: [authorized_data_probe]
    probe:
      dataset_id: scheduler.jobs
      shape_id: job_candidates
      output_slot: job_id
  from_date: { type: date, required: true }
  to_date: { type: date, required: true }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
