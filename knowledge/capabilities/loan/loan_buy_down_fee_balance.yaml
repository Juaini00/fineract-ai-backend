id: loan_buy_down_fee_balance
status: approved_mvp
domain: loan
display_name: Loan Buy-down Fee Balances
description: >-
  Buy-down-fee balance records per loan read from m_loan_buy_down_fee_balance (LOAN-12, D15), one row per
  Buy-down-fee source transaction: original amount, adjustments, unrecognized
  (not yet amortized) amount, charged-off amount and the closed flag, in the
  loan's currency. Records whose source transaction was reversed (is_deleted)
  are excluded. Kept separate from the other D15 balance table.
data_areas: [loans_capitalized_balances]
required_api_capability: loan_buy_down_fee_balance
query_id: loan.loan_buy_down_fee_balance
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_buy_down_fee_balance, grouping: none, output: list, pii: none }
examples:
  - Show buy-down fee balances for loans in my offices.
  - Tampilkan saldo biaya buy-down pinjaman.
supported_intents:
  - list Buy-down-fee balance records per loan with amount, adjustment, unrecognized and charged-off amounts
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
