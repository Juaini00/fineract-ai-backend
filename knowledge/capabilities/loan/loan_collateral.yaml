id: loan_collateral
status: approved_mvp
domain: loan
display_name: Loan Collateral
description: >-
  Pledged collateral per loan with type, quality, quantity and a value computed
  at the collateral master's CURRENT rate (quantity * base_price * pct_to_base
  / 100, not the value recorded at pledge time), in the collateral master's own
  currency beside the loan currency -- never assumed equal. Kept distinct from
  guarantor (loan_guarantor); never conflated into one list (LOAN-10).
data_areas: [loans_collateral_guarantor]
required_api_capability: loan_collateral
query_id: loan.loan_collateral
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_collateral, grouping: none, output: list, pii: none }
examples:
  - List pledged collateral for loans in my authorized offices.
  - Show collateral value for this loan.
  - Tampilkan agunan yang dijaminkan untuk pinjaman ini.
supported_intents:
  - list pledged collateral per loan with type/quality and current-master-rate value in collateral currency, distinct from guarantor
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
