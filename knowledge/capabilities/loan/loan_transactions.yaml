id: loan_transactions
status: approved_mvp
domain: loan
display_name: Loan Transactions
description: >-
  List loan transactions (disbursement, repayment, waivers, write-off, and
  the rest) within a date range and authorized offices, with amount
  allocation across principal/interest/fee/penalty/overpayment. Reversed
  transactions are excluded by default (LOAN-6).
data_areas: [loans_servicing]
required_api_capability: loan_transactions
query_id: loan.loan_transactions
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan, grouping: none, output: list, pii: none }
examples:
  - Show loan transactions in my authorized offices this month.
  - List loan repayments and disbursements for this period.
  - Tampilkan transaksi pinjaman bulan ini.
supported_intents:
  - list loan transactions with allocation across principal/interest/fee/penalty, reversals excluded by default
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_date_range_days: 366
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
