id: loan_writeoff
status: approved_mvp
domain: loan
display_name: Loan Write-off
description: >-
  Recorded write-off per loan with reason and the written-off amount broken
  down by principal/interest/fee/penalty, read from m_loan's own derived
  columns (LOAN-11, mirrors LOAN-8), in the loan's currency. Zero rows on this
  deployment; query behaviour proven by a read-only fixture, not by production
  data.
data_areas: [loans_reschedule_recovery]
required_api_capability: loan_writeoff
query_id: loan.loan_writeoff
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_writeoff, grouping: none, output: list, pii: none }
examples:
  - Show written-off loans in my offices.
  - List the write-off reason and amount for this loan.
  - Tampilkan pinjaman yang telah dihapusbukukan (write-off).
supported_intents:
  - list recorded write-off per loan with reason and amount breakdown
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
