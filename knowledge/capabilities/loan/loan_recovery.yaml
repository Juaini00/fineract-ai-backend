id: loan_recovery
status: approved_mvp
domain: loan
display_name: Loan Recovery
description: >-
  Recovery payments on written-off loans, filtered to transaction_type_enum
  = 8 (recovery_repayment); reversed recovery transactions are excluded by
  default so they never count toward cash totals (LOAN-11, mirrors LOAN-6).
  Amounts in the loan's currency. Zero rows on this deployment; query
  behaviour proven by a read-only fixture, not by production data.
data_areas: [loans_reschedule_recovery]
required_api_capability: loan_recovery
query_id: loan.loan_recovery
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_recovery, grouping: none, output: list, pii: none }
examples:
  - Show loan recovery payments in my offices.
  - List recovery transactions for written-off loans.
  - Tampilkan pembayaran recovery untuk pinjaman yang dihapusbukukan.
supported_intents:
  - list recovery payments on written-off loans, reversals excluded from cash totals by default
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
