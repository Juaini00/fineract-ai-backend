id: loan_charges
status: approved_mvp
domain: loan
display_name: Loan Charges
description: >-
  List loan charges and penalties within authorized offices, separating the
  charged amount from what was actually paid, waived or written off, and
  the amount still outstanding (LOAN-7).
data_areas: [loans_charges_balances]
required_api_capability: loan_charges
query_id: loan.loan_charges
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan_charge, grouping: none, output: list, pii: none }
examples:
  - Show loan charges in my authorized offices.
  - List outstanding loan penalties.
  - Tampilkan biaya pinjaman yang masih outstanding.
supported_intents:
  - list loan charges/penalties with charged vs paid/waived/written-off/outstanding separated
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
