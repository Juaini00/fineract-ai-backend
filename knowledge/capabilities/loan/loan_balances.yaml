id: loan_balances
status: approved_mvp
domain: loan
display_name: Loan Balances
description: >-
  Outstanding loan balances (principal/interest/fees/penalties and total)
  within authorized offices, read directly from Fineract's own recorded
  derived balance columns — never recomputed from schedule or transactions
  (LOAN-8).
data_areas: [loans_charges_balances]
required_api_capability: loan_balances
query_id: loan.loan_balances
metrics: []
output_mode: list
request_shape: { operation: list, subject: loan, grouping: none, output: list, pii: none }
examples:
  - Show outstanding loan balances in my authorized offices.
  - What is the loan balance for these accounts?
  - Tampilkan saldo outstanding pinjaman.
supported_intents:
  - list recorded outstanding loan balances per loan account
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
  pii: { returns_pii: false }
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  limit:
    type: integer
    required: false
    default: "100"
    hard_cap: 500
