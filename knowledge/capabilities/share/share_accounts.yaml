id: share_accounts
status: approved_mvp
domain: share
display_name: Share Accounts
description: >-
  List share accounts: account ID, client ID, product ID, product name, product currency code,
  status enum, lifecycle dates, account currency, currency digits, currency multiples of,
  total approved shares, total pending shares, effective terms, allow dividends for inactive
  clients, and savings account linkage. Ownership measure is approved shares only; pending
  shares are reported separately and not counted as owned. Savings account ID surfaces as linkage
  only and never proves settlement. Account numbers and external IDs are never returned.
data_areas: [share_accounts, organization_foundation]
required_api_capability: share_accounts
query_id: share.share_accounts
metrics: []
output_mode: list
request_shape: { operation: list, subject: share_account, grouping: none, output: list, pii: none }
examples:
  - Show share accounts from November 2025 to April 2026.
  - List share accounts in my authorized offices.
  - Tampilkan rekening saham dari November 2025 sampai April 2026.
supported_intents:
  - list share accounts in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: approved_shares_measure_only
    rule: ownership measure counts approved shares only; total_pending_shares is reported separately.
  - id: linked_savings_not_settlement
    rule: savings_account_id is surfaced as linkage only, never proving settlement of purchases or redemptions.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
