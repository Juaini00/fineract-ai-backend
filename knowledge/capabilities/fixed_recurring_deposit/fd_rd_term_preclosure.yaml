id: fd_rd_term_preclosure
status: approved_mvp
domain: fixed_recurring_deposit
display_name: Fixed and Recurring Deposit Terms and Preclosure
description: >-
  List fixed and recurring deposit terms and preclosure details: deposit and projected maturity amounts,
  maturity date, deposit term/period, penal interest conditions, and closure instructions. Governed
  by client office. Account numbers and external IDs are never returned.
data_areas: [fixed_recurring_deposit, organization_foundation]
required_api_capability: fd_rd_term_preclosure
query_id: fixed_recurring_deposit.fd_rd_term_preclosure
metrics: []
output_mode: list
request_shape: { operation: list, subject: fixed_recurring_deposit_term, grouping: none, output: list, pii: none }
examples:
  - Show fixed and recurring deposit terms from April 2026 to June 2026.
  - List term and preclosure details for accounts maturing this quarter.
  - Tampilkan syarat dan ketentuan deposito serta pencairan dini dari Januari 2026 sampai Desember 2026.
supported_intents:
  - list fixed and recurring deposit terms and preclosure details in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: maturity_is_projected
    rule: maturity_amount is labeled and checked as a projected figure, never asserted as payout evidence.
  - id: closure_instruction_not_payout
    rule: on_account_closure_enum is surfaced as instruction/config, never interpreted as executed payout or reinvestment chain.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
