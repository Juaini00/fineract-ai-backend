id: rd_shortfall
status: approved_mvp
domain: fixed_recurring_deposit
display_name: Recurring Deposit Shortfall
description: >-
  List recurring deposit shortfall: total overdue amount and overdue installments from recurring
  detail records. Stored batch-computed facts distinct from loan arrears; nulls remain null.
  Governed by client office. Account numbers and external IDs are never returned.
data_areas: [fixed_recurring_deposit, organization_foundation]
required_api_capability: rd_shortfall
query_id: fixed_recurring_deposit.rd_shortfall
metrics: []
output_mode: list
request_shape: { operation: list, subject: recurring_deposit_shortfall, grouping: none, output: list, pii: none }
examples:
  - Show recurring deposit shortfall from January 2026 to March 2026.
  - List RD overdue installments and amounts in my authorized offices.
  - Tampilkan tunggakan tabungan berencana dari Januari 2026 sampai Maret 2026.
supported_intents:
  - list recurring deposit shortfall in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: shortfall_distinct_from_loan_arrears
    rule: RD shortfall is stored batch-computed fact from recurring detail, never loan arrears.
  - id: nullable_not_zeroed
    rule: NULL overdue amounts remain NULL, never coerced to 0.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
