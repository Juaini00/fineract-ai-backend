id: fd_rd_funding
status: approved_mvp
domain: fixed_recurring_deposit
display_name: Fixed and Recurring Deposit Funding
description: >-
  List initial deposit transactions on fixed and recurring deposit accounts near activation:
  account ID, client/office IDs, deposit type, currency, transaction date, amount, and reversal flag.
  Governed by client office. Account numbers and external IDs are never returned.
data_areas: [fixed_recurring_deposit, organization_foundation]
required_api_capability: fd_rd_funding
query_id: fixed_recurring_deposit.fd_rd_funding
metrics: []
output_mode: list
request_shape: { operation: list, subject: fixed_recurring_deposit_funding, grouping: none, output: list, pii: none }
examples:
  - Show recorded fixed deposit funding transactions from January 2026 to March 2026.
  - List term deposit funding deposits in my authorized offices this month.
  - Tampilkan transaksi pendanaan awal deposito dari Januari 2026 sampai Maret 2026.
supported_intents:
  - list recorded fixed and recurring deposit funding transactions in a date window
guards:
  require_office_scope: true
  max_date_range_days: 366
  pii:
    returns_pii: false
    never_return:
      - account_no
      - external_id
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
  from_date: { type: date, required: false, default: start_of_month(business_today) }
  to_date: { type: date, required: false, default: business_today }
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: funding_is_reading_not_event
    rule: funding is described as recorded deposit transactions near activation, not a distinct event type.
  - id: reversals_surfaced_or_filtered
    rule: reversed transactions are excluded and explicit boolean flag is projected.
  - id: no_account_numbers
    rule: account_no and external_id are never returned.
