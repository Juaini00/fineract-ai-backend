id: teller_cashier.cashier_assignments
database: fineract
sql_file: queries/teller_cashier/cashier_assignments.sql
data_areas: [teller_cashier_ops]
tables: [m_cashiers, m_tellers]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: cashier_id, type: bigint, sensitivity: public_business }
  - { name: teller_id, type: bigint, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: staff_id, type: bigint, sensitivity: public_business }
  - { name: assignment_start_date, type: date, sensitivity: public_business }
  - { name: assignment_end_date, type: date, sensitivity: public_business }
  - { name: is_full_day, type: boolean, sensitivity: public_business }
  - { name: start_time, type: string, sensitivity: public_business }
  - { name: end_time, type: string, sensitivity: public_business }
  - { name: teller_valid_from, type: date, sensitivity: public_business }
  - { name: teller_valid_to, type: date, sensitivity: public_business }
  - { name: teller_state_enum, type: bigint, sensitivity: public_business }
  - { name: teller_state, type: string, sensitivity: public_business }
grain: [cashier_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_tellers.office_id with ANY($1::bigint[]).
  - id: window_overlap_declared
    rule: an assignment is returned when its [start_date, end_date] overlaps [from_date, to_date]; a NULL bound is treated as open and returned as NULL.
  - id: no_names_or_free_text
    rule: staff and teller names and descriptions are never selected; the staff member is a surrogate staff_id.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
