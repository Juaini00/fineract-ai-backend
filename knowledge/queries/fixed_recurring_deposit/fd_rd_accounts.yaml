id: fixed_recurring_deposit.fd_rd_accounts
database: fineract
sql_file: queries/fixed_recurring_deposit/fd_rd_accounts.sql
data_areas: [fixed_recurring_deposit]
tables: [m_savings_account, m_client]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: savings_account_id, type: bigint, sensitivity: public_business }
  - { name: client_id, type: bigint, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: deposit_type_enum, type: bigint, sensitivity: public_business }
  - { name: status_enum, type: bigint, sensitivity: public_business }
  - { name: product_id, type: bigint, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: nominal_annual_interest_rate, type: numeric, sensitivity: public_business }
  - { name: total_interest_posted_derived, type: numeric, sensitivity: public_business }
  - { name: submittedon_date, type: date, sensitivity: public_business }
  - { name: activatedon_date, type: date, sensitivity: public_business }
  - { name: closedon_date, type: date, sensitivity: public_business }
grain: [savings_account_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_client.office_id with ANY($1::bigint[]).
  - id: deposit_types_filtered
    rule: deposit_type_enum is constrained to 200 (fixed deposit) and 300 (recurring deposit).
  - id: no_periodic_schedule_imposed
    rule: interest is reported from recorded derived columns without imposing a periodic schedule on FD.
  - id: no_account_numbers
    rule: account_no and external_id are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
