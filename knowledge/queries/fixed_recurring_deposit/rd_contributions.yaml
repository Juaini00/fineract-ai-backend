id: fixed_recurring_deposit.rd_contributions
database: fineract
sql_file: queries/fixed_recurring_deposit/rd_contributions.sql
data_areas: [fixed_recurring_deposit]
tables: [m_savings_account, m_client, m_deposit_account_recurring_detail, m_deposit_account_term_and_preclosure, m_savings_account_transaction]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: savings_account_id, type: bigint, sensitivity: public_business }
  - { name: client_id, type: bigint, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: expected_deposit_amount, type: numeric, sensitivity: public_business }
  - { name: actual_deposit_amount, type: numeric, sensitivity: public_business }
  - { name: actual_deposit_count, type: bigint, sensitivity: public_business }
  - { name: deposit_period, type: integer, sensitivity: public_business }
  - { name: deposit_period_frequency_enum, type: bigint, sensitivity: public_business }
  - { name: is_calendar_inherited, type: boolean, sensitivity: public_business }
  - { name: is_mandatory, type: boolean, sensitivity: public_business }
grain: [savings_account_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_client.office_id with ANY($1::bigint[]).
  - id: expected_vs_actual_separated
    rule: expected mandatory configuration and actual recorded deposits remain distinct columns, never merged.
  - id: anti_fanout_subquery
    rule: transaction aggregation is conducted in a scalar subquery to preserve account grain without fan-out.
  - id: frequency_and_linkage_surfaced
    rule: deposit_period, frequency, and is_calendar_inherited are surfaced.
  - id: no_account_numbers
    rule: account_no and external_id are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
