id: client.client_address
database: fineract
sql_file: queries/client/client_address.sql
data_areas:
  - client_foundation
  - organization_foundation
tables:
  - m_client_address
  - m_client
  - m_address
  - m_code_value
metrics: []
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: limit
    type: integer
    required: false
output_fields:
  - name: client_address_id
    type: bigint
    sensitivity: public_business
  - name: client_id
    type: bigint
    sensitivity: public_business
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: address_id
    type: bigint
    sensitivity: public_business
  - name: address_type_id
    type: bigint
    sensitivity: public_business
  - name: address_type
    type: string
    sensitivity: public_business
  - name: is_active
    type: boolean
    sensitivity: public_business
  - name: street
    type: string
    sensitivity: pii
  - name: address_line_1
    type: string
    sensitivity: pii
  - name: address_line_2
    type: string
    sensitivity: pii
  - name: address_line_3
    type: string
    sensitivity: pii
  - name: town_village
    type: string
    sensitivity: pii
  - name: city
    type: string
    sensitivity: pii
  - name: county_district
    type: string
    sensitivity: pii
  - name: state_province_id
    type: bigint
    sensitivity: public_business
  - name: country_id
    type: bigint
    sensitivity: public_business
  - name: postal_code
    type: string
    sensitivity: pii
  - name: latitude
    type: decimal
    sensitivity: pii
  - name: longitude
    type: decimal
    sensitivity: pii
grain: [client_address_id]
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_client.office_id with ANY($1::bigint[]).
  - id: pii_declared
    rule: address detail fields carry pii sensitivity.
  - id: no_identifiers
    rule: account_no and external_id are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
