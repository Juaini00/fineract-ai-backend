id: client.client_charge_assessments
database: fineract
sql_file: queries/client/client_charge_assessments.sql
data_areas: [client_charges]
tables: [m_client_charge, m_client, m_charge]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: client_charge_id, type: bigint, sensitivity: public_business }
  - { name: client_id, type: bigint, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: charge_id, type: bigint, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: amount, type: numeric, sensitivity: public_business }
  - { name: amount_paid_derived, type: numeric, sensitivity: public_business }
  - { name: amount_waived_derived, type: numeric, sensitivity: public_business }
  - { name: amount_writtenoff_derived, type: numeric, sensitivity: public_business }
  - { name: amount_outstanding_derived, type: numeric, sensitivity: public_business }
  - { name: charge_due_date, type: date, sensitivity: public_business }
  - { name: charge_time_enum, type: bigint, sensitivity: public_business }
  - { name: charge_calculation_enum, type: bigint, sensitivity: public_business }
  - { name: is_penalty, type: boolean, sensitivity: public_business }
  - { name: is_paid_derived, type: boolean, sensitivity: public_business }
  - { name: waived, type: boolean, sensitivity: public_business }
  - { name: is_active, type: boolean, sensitivity: public_business }
  - { name: inactivated_on_date, type: date, sensitivity: public_business }
grain: [client_charge_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_client.office_id with ANY($1::bigint[]).
  - id: master_not_actual
    rule: master charge definition (m_charge) is separated from actual assessment (m_client_charge); currency comes from m_charge.currency_code.
  - id: nullable_derived_not_zeroed
    rule: derived amounts (paid, waived, written off, outstanding) are returned as recorded without COALESCE to zero.
  - id: no_names_or_free_text
    rule: client names and free-text descriptions are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
