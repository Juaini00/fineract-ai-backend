id: scheduler.job_failed_runs
database: fineract
sql_file: queries/scheduler/job_failed_runs.sql
data_areas: [scheduler_ops]
tables: [job_run_history, job]
metrics: []
parameters:
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: run_id, type: bigint, sensitivity: public_business }
  - { name: job_id, type: bigint, sensitivity: public_business }
  - { name: job_name, type: string, sensitivity: public_business }
  - { name: start_time, type: string, sensitivity: public_business }
  - { name: end_time, type: string, sensitivity: public_business }
  - { name: status, type: string, sensitivity: public_business }
  - { name: trigger_type, type: string, sensitivity: public_business }
  - { name: job_latest_run_status, type: string, sensitivity: public_business }
grain: [run_id]
guards: { select_only: true, single_statement: true, require_office_filter: false, operational_tenant_wide: true, parameterized_only: true }
timeout_ms: 15000
checks:
  - id: window_half_open
    rule: SQL selects runs with start_time >= $1 and start_time < $2 + 1 day.
  - id: deterministic_order
    rule: ORDER BY start_time DESC, run id DESC before the bound LIMIT.
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
