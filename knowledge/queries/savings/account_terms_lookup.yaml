id: savings.account_terms_lookup
database: fineract
sql_file: queries/savings/account_terms_lookup.sql
data_areas: [client_foundation, savings_core]
tables: [m_savings_account, m_client, m_savings_product]
metrics: [savings.account_terms]
# FIN-137: account_number resolves through savings_account_identity_resolve
# (dataset savings.accounts, shape identity_candidates) before this query
# runs. The identity slot is savings_account_id — a resolved, server-issued
# option (K1) — not the raw account number.
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: savings_account_id, type: integer, required: true }
output_fields:
  - { name: savings_account_id, type: bigint, sensitivity: public_business }
  - { name: masked_account_number, type: string, sensitivity: masked_output }
  - { name: account_nominal_annual_interest_rate, type: decimal, sensitivity: public_business }
  - { name: product_nominal_annual_interest_rate, type: decimal, sensitivity: public_business }
  - { name: account_allow_overdraft, type: boolean, sensitivity: public_business }
  - { name: product_allow_overdraft, type: boolean, sensitivity: public_business }
  - { name: account_overdraft_limit, type: decimal, sensitivity: public_business }
  - { name: product_overdraft_limit, type: decimal, sensitivity: public_business }
grain: [savings_account_id]
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
