id: savings.savings_account_holds
database: fineract
sql_file: queries/savings/savings_account_holds.sql
data_areas: [savings_transactions, savings_core, organization_foundation]
tables: [m_savings_account_transaction, m_savings_account, m_client]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: from_date, type: date, required: true }
  - { name: to_date, type: date, required: true }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: transaction_id, type: bigint, sensitivity: public_business }
  - { name: savings_account_id, type: bigint, sensitivity: public_business }
  - { name: client_id, type: bigint, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: transaction_office_id, type: bigint, sensitivity: public_business }
  - { name: transaction_type_enum, type: bigint, sensitivity: public_business }
  - { name: transaction_date, type: date, sensitivity: public_business }
  - { name: amount, type: decimal, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: hold_type, type: bigint, sensitivity: public_business }
  - { name: hold_status, type: bigint, sensitivity: public_business }
  - { name: parent_hold_transaction_id, type: bigint, sensitivity: public_business }
  - { name: release_id_of_hold_amount, type: bigint, sensitivity: public_business }
  - { name: is_lien_transaction, type: boolean, sensitivity: public_business }
grain: [transaction_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains m_client.office_id with ANY($1::bigint[]).
  - id: transaction_office_is_evidence_only
    rule: m_savings_account_transaction.office_id is surfaced as transaction_office_id evidence only, never an authorization filter.
  - id: hold_not_completed_withdrawal
    rule: holds (type 20) and releases (type 21) are surfaced with hold_type, hold_status, parent_hold_transaction_id, and release_id_of_hold_amount linkage, distinct from completed withdrawals.
  - id: unresolved_types_kept_raw
    rule: types 22-26 remain raw bigint without invented labels.
  - id: reversed_transactions_excluded
    rule: is_reversed = false excludes reversals by default.
  - id: no_account_numbers
    rule: account_no and external_id are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
