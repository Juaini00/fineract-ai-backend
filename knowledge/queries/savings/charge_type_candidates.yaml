id: savings.charge_type_candidates
database: fineract
# Wraps the savings.charge_definitions dataset's charge_type_candidates probe
# shape so an approved capability can back it (guard/executor drive SQL off
# a capability's dataset_recipe; a probe shape needs a capability + query
# wrapper). Columns match the shape's frag SELECT.
sql_file: queries/datasets/savings/charge_definitions.source.sql
data_areas: [organization_foundation, client_foundation, savings_core, savings_charges_fees]
tables: [m_charge, m_savings_account_charge, m_savings_account, m_client]
metrics: [savings.charge_count]
# Tautan ke shape dataset yang dibungkus manifest ini. Sebelumnya tautan itu
# hanya hidup sebagai komentar di atas, dan koneksi yang hanya berupa prosa
# adalah persis yang invarian I6 larang.
resolves: { dataset_id: savings.charge_definitions, shape_id: charge_type_candidates }
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
output_fields:
  - { name: charge_definition_id, type: bigint, sensitivity: public_business }
  - { name: charge_name, type: string, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: is_penalty, type: boolean, sensitivity: public_business }
grain: [charge_definition_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
