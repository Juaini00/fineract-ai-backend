id: loan.loan_terms_by_client
database: fineract
sql_file: queries/loan/loan_terms_by_client.sql
data_areas: [loans_identity, products_master, client_foundation, group_center_foundation]
tables: [m_loan, m_product_loan, m_client, m_group]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: client_id, type: integer, required: true }
output_fields:
  - { name: loan_id, type: bigint, sensitivity: public_business }
  - { name: client_id, type: bigint, sensitivity: public_business }
  - { name: product_id, type: bigint, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: account_principal_amount, type: decimal, sensitivity: public_business }
  - { name: account_interest_rate_per_period, type: decimal, sensitivity: public_business }
  - { name: account_interest_period_frequency_enum, type: bigint, sensitivity: public_business }
  - { name: account_term_frequency, type: bigint, sensitivity: public_business }
  - { name: account_term_period_frequency_enum, type: bigint, sensitivity: public_business }
  - { name: account_number_of_repayments, type: bigint, sensitivity: public_business }
  - { name: product_default_principal_amount, type: decimal, sensitivity: public_business }
  - { name: product_default_interest_rate_per_period, type: decimal, sensitivity: public_business }
  - { name: product_default_number_of_repayments, type: bigint, sensitivity: public_business }
grain: [loan_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL binds authorized office_ids to the client office, else the group office.
  - id: no_identity_fields
    rule: account_no and external_id are never output.
