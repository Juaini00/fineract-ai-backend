id: loan.loan_recovery
database: fineract
sql_file: queries/loan/loan_recovery.sql
data_areas: [loans_reschedule_recovery]
tables: [m_loan_transaction, m_loan]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: transaction_id, type: bigint, sensitivity: public_business }
  - { name: loan_id, type: bigint, sensitivity: public_business }
  - { name: transaction_date, type: date, sensitivity: public_business }
  - { name: amount, type: decimal, sensitivity: public_business }
  - { name: principal_portion_derived, type: decimal, sensitivity: public_business }
  - { name: interest_portion_derived, type: decimal, sensitivity: public_business }
  - { name: fee_charges_portion_derived, type: decimal, sensitivity: public_business }
  - { name: penalty_charges_portion_derived, type: decimal, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
grain: [transaction_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL binds authorized office_ids to m_loan_transaction.office_id directly (LOAN-6 path, not re-derived through client/group).
  - id: recovery_type_filter_present
    rule: SQL must filter transaction_type_enum = 8 (recovery_repayment).
  - id: reversed_excluded_by_default
    rule: a reversed recovery transaction must be excluded from cash totals by default (is_reversed = false).
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
