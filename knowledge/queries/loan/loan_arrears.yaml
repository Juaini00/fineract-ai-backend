id: loan.loan_arrears
database: fineract
sql_file: queries/loan/loan_arrears.sql
data_areas: [loans_charges_balances, client_foundation, group_center_foundation]
tables: [m_loan_arrears_aging, m_loan, m_client, m_group]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: loan_id, type: bigint, sensitivity: public_business }
  - { name: principal_overdue_derived, type: decimal, sensitivity: public_business }
  - { name: interest_overdue_derived, type: decimal, sensitivity: public_business }
  - { name: fee_charges_overdue_derived, type: decimal, sensitivity: public_business }
  - { name: penalty_charges_overdue_derived, type: decimal, sensitivity: public_business }
  - { name: total_overdue_derived, type: decimal, sensitivity: public_business }
  - { name: overdue_since_date_derived, type: date, sensitivity: public_business }
grain: [loan_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL binds authorized office_ids to the owning loan's client office, else the group office.
  - id: asof_signal_present
    rule: overdue_since_date_derived must be output on every row so the response carries a point-in-time signal (XR-ASOF) rather than being asserted as always-current.
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
