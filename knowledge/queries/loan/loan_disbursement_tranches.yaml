id: loan.loan_disbursement_tranches
database: fineract
sql_file: queries/loan/loan_disbursement_tranches.sql
data_areas: [loans_disbursement, client_foundation, group_center_foundation]
tables: [m_loan_disbursement_detail, m_loan, m_client, m_group]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: disbursement_detail_id, type: bigint, sensitivity: public_business }
  - { name: loan_id, type: bigint, sensitivity: public_business }
  - { name: expected_disburse_date, type: date, sensitivity: public_business }
  - { name: disbursedon_date, type: date, sensitivity: public_business }
  - { name: principal, type: decimal, sensitivity: public_business }
  - { name: net_disbursal_amount, type: decimal, sensitivity: public_business }
  - { name: is_reversed, type: boolean, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
grain: [disbursement_detail_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL binds authorized office_ids to the owning loan's client office, else the group office.
  - id: separate_from_loan_grain
    rule: this query must not be joined with loan.loan_disbursement in one result set; the two grains stay separate (no multi-child fanout).
  - id: deterministic_order
    rule: rows are ordered by loan_id, expected_disburse_date, then disbursement_detail_id as the tie-break.
  - id: currency_per_row
    rule: every row carries the owning loan's currency_code.
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
