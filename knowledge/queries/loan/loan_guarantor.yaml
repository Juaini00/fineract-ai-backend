id: loan.loan_guarantor
database: fineract
sql_file: queries/loan/loan_guarantor.sql
data_areas: [loans_collateral_guarantor, client_foundation, group_center_foundation]
tables: [m_guarantor, m_loan, m_client, m_group]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: guarantor_id, type: bigint, sensitivity: public_business }
  - { name: loan_id, type: bigint, sensitivity: public_business }
  - { name: type_enum, type: bigint, sensitivity: public_business }
  - { name: guarantor_type, type: string, sensitivity: public_business }
  - { name: entity_id, type: bigint, sensitivity: public_business }
  - { name: firstname, type: string, sensitivity: pii }
  - { name: lastname, type: string, sensitivity: pii }
  - { name: is_active, type: boolean, sensitivity: public_business }
grain: [guarantor_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL binds authorized office_ids to the owning loan's client office, else the group office.
  - id: no_collateral_fanout
    rule: this query must not be joined to m_loan_collateral_management; guarantor and collateral stay distinct result sets (LOAN-10).
  - id: pii_columns_labelled
    rule: firstname and lastname output fields must be sensitivity=pii and gated by the global PII switch.
  - id: no_raw_identifiers
    rule: Query must not output address, phone, or dob columns.
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
