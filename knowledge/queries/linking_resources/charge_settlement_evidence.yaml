id: linking_resources.charge_settlement_evidence
database: fineract
sql_file: queries/linking_resources/charge_settlement_evidence.sql
data_areas: [linking_resources]
tables: [m_savings_account_charge_paid_by, m_savings_account_charge, m_savings_account_transaction, m_savings_account]
metrics: []
parameters:
  - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
  - { name: limit, type: integer, required: false }
output_fields:
  - { name: charge_paid_by_id, type: bigint, sensitivity: public_business }
  - { name: savings_account_charge_id, type: bigint, sensitivity: public_business }
  - { name: savings_account_transaction_id, type: bigint, sensitivity: public_business }
  - { name: savings_account_id, type: bigint, sensitivity: public_business }
  - { name: charge_id, type: bigint, sensitivity: public_business }
  - { name: amount, type: decimal, sensitivity: public_business }
  - { name: transaction_date, type: date, sensitivity: public_business }
  - { name: currency_code, type: string, sensitivity: public_business }
  - { name: office_id, type: bigint, sensitivity: public_business }
grain: [charge_paid_by_id]
guards: { select_only: true, single_statement: true, require_office_filter: true, parameterized_only: true }
timeout_ms: 3000
checks:
  - id: office_filter_is_bound
    rule: SQL constrains sat.office_id with ANY($1::bigint[]).
  - id: settlement_not_inferred
    rule: settlement evidence links charges to paying transactions directly, never inferred from balance drops.
  - id: no_account_numbers
    rule: account_no and external_id are never selected.
  - id: limit_is_bound
    rule: SQL uses a bound LIMIT parameter after a total ORDER BY.
