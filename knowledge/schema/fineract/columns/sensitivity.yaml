id: fineract.columns.sensitivity
source_doc: docs/reporting-pii-policy.md#2-sensitivity-classes
classes:
  public_business:
    default_behavior: allow_if_capability_declares
    examples: [office_name, product_name, amount, currency_code]
  sensitive_business_identifier:
    default_behavior: exclude
    examples: [account_no, external_id, ref_no]
  pii:
    default_behavior: require_can_view_pii_and_capability_approval
    examples: [display_name, mobile_no, email_address]
  security_sensitive:
    default_behavior: exclude
    examples: [username, role, permission, client_ip]
  secret_never_expose:
    default_behavior: never_expose
    examples: [password, token, command_as_json, result]
    # Padanan Indonesia (FIN-140): permintaan berbahasa Indonesia atas field
    # rahasia harus ditolak sama seperti padanan Inggrisnya.
    synonyms: [kata sandi, sandi, hash kata sandi]
  # Ditambahkan 2026-09-13: dipakai 4 manifest query (account_no yang sudah
  # dipotong menjadi ****1234) tanpa pernah dideklarasikan di sini, sehingga
  # kebijakan PII tidak punya aturan untuknya dan ia lolos tanpa pemeriksaan.
  # Nilainya TURUNAN: identifier aslinya tidak dapat direkonstruksi darinya.
  masked_output:
    default_behavior: allow_if_capability_declares
    derived_from: sensitive_business_identifier
    examples: [masked_account_number]
  free_text_sensitive:
    default_behavior: exclude
    examples: [description, remarks, reason_for_block]
checks:
  - id: every_query_output_has_sensitivity
    rule: every query output field must declare one class listed here.
  - id: pii_requires_capability
    rule: fields classified as pii require can_view_pii and explicit capability approval.
  - id: secret_never_expose_absent
    rule: secret_never_expose fields must not appear in schema prompts, query output, logs, or responses.
