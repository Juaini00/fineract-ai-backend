id: source_audit
status: gap
source_doc: docs/data/dataset-inventory.md#10-cross-domain-decisions-d01-d15
inventory_refs:
  - D09
description: >-
  Fineract's own operational command/action audit
  (`m_portfolio_command_source`) — agreed baseline scope per D09
  (dataset-scope-decisions.md:128-134), no approved capability yet. Distinct
  from `audit_users_operations.yaml` (user/role/permission administration,
  excluded per D15) — this area only ever holds the source-audit table, never
  the administration tables.
included_tables: []
conditional_tables:
  - m_portfolio_command_source
excluded_tables: []
allowed_domains:
  - audit
default_rules:
  - m_portfolio_command_source (D09) is agreed baseline scope with no approved capability yet; it stays out of excluded_tables in both this file and audit_users_operations.yaml.
checks:
  - id: gap_not_runtime
    rule: this area must not be referenced by approved_mvp capabilities or queries until a Mode-1 capability is authored.
  - id: no_administration_tables_here
    rule: m_appuser, m_role, and m_permission must never appear in this file — they belong to audit_users_operations.yaml.
