id: source_audit
status: included_mvp_domain
source_doc: docs/product/2026-09-09-dataset-scope-decisions.md:128-134
inventory_refs:
  - D09
description: >-
  Fineract's own operational command/action audit (`m_portfolio_command_source`) —
  agreed baseline scope per D09 (dataset-scope-decisions.md:128-134).
  Actor attribution is taken from the command row (`maker_id` -> username),
  never from an officer assignment table. Distinct from user/role/permission administration
  (excluded per D15) and Jarvis's own execution audit (database-design.md I8).
  Raw payloads (command_as_json, result, client_ip, api_get_url, *_external_id) are excluded.
included_tables:
  - m_portfolio_command_source
conditional_tables: []
excluded_tables: []
allowed_domains:
  - source_audit
default_rules:
  - "Fineract's own source audit reads m_portfolio_command_source; raw payloads are excluded."
  - "Actor attribution is taken strictly from maker_id, never from officer assignments."
  - "Office scope is enforced via office_id = ANY($1::bigint[]); commands without office_id are org-wide."
checks:
  - id: no_raw_payload
    rule: command_as_json, result, client_ip, api_get_url, and external IDs are never selected.
  - id: actor_from_command_row
    rule: actor is resolved via maker_id on m_portfolio_command_source.
  - id: office_scope_required
    rule: queries bind authorized office scope via ANY($1::bigint[]).
