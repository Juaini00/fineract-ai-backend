id: loans_charges_balances
status: included_mvp_domain
source_doc: docs/data/dataset-inventory.md#5-domain-d--loan
inventory_refs: [LOAN-7, LOAN-8, LOAN-9]
description: >-
  Loan charges/penalties with charged-vs-collected separation, outstanding
  balances read from m_loan's own derived columns, and arrears/delinquency
  snapshots, FIN-108 slice 3. Disbursement, collateral/guarantor and
  reschedule/write-off/recovery stay in the gap area `loans`.
included_tables:
  - m_loan_charge
  - m_loan_arrears_aging
  - m_loan
conditional_tables: []
excluded_tables: []
allowed_domains: [loan]
default_rules:
  - A loan charge row separates amount (charged) from amount_paid_derived, amount_waived_derived, amount_writtenoff_derived and amount_outstanding_derived; they are never merged into one figure (LOAN-7, mirrors D04).
  - Loan balances are read from m_loan's own *_derived columns; they are never recomputed from m_loan_repayment_schedule or m_loan_transaction (LOAN-8, mirrors the GL rule in D12).
  - An arrears row is a point-in-time snapshot (XR-ASOF); overdue_since_date_derived must travel with the response, and the data is never presented as always-current — freshness depends on COB having run (D14, still gap).
checks:
  - id: office_scope_required
    rule: every approved query binds authorized office_ids through the owning loan's client or group office path; none of these three tables carry a direct office_id.
  - id: charge_state_not_merged
    rule: a loan charge query must output amount, amount_paid_derived, amount_waived_derived, amount_writtenoff_derived and amount_outstanding_derived as distinct fields.
  - id: balances_read_not_recomputed
    rule: a loan balance query must select m_loan's *_derived columns directly, with no join to m_loan_repayment_schedule or m_loan_transaction for the balance figures.
  - id: arrears_carries_asof
    rule: an arrears query must output overdue_since_date_derived on every row.
