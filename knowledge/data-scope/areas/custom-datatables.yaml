id: custom_datatables
status: deferred_onboarding
source_doc: docs/data/dataset-inventory.md#10-cross-domain-decisions-d01-d15
inventory_refs:
  - D10
description: >-
  User-defined Fineract data tables and dynamic column extensions — deferred
  to deployment onboarding (D10), since the actual table/field set is
  per-tenant and cannot be closed generically (unlike `gap` domains, which
  merely lack a capability against an already-known schema).
included_tables: []
conditional_tables: []
excluded_tables:
  - x_registered_table
  - x_table_column_code_mappings
  - m_entity_datatable_check
allowed_domains: []
default_rules:
  - Custom datatables are tenant-specific and have no static schema; reporting is deferred until a typed introspection layer is added.
checks:
  - id: deferred_not_runtime
    rule: this area must not be referenced by approved_mvp capabilities or queries.
  - id: field_classification_required
    rule: every custom datatable field must be classified before use.
