id: accounting_gl
status: gap
source_doc: docs/data/dataset-inventory.md#10-cross-domain-decisions-d01-d15
inventory_refs:
  - D12
description: >-
  Accounting general ledger — journal entries and one named GL account's
  balance/movement (D12). Full trial balance/financial statements stay
  excluded by D12 itself; see `knowledge/domains/accounting.yaml`.
included_tables: []
conditional_tables: []
excluded_tables:
  - acc_gl_account
  - acc_gl_journal_entry
  - acc_accounting_rule
  - acc_product_mapping
  - acc_gl_closure
allowed_domains:
  - accounting
default_rules:
  - GL traceability is agreed baseline scope (D12) with no approved capability yet; journal entry retrieval must still respect the D12 boundary (no trial balance/financial statements) once a capability is authored.
checks:
  - id: gap_not_runtime
    rule: this area must not be referenced by approved_mvp capabilities or queries until a Mode-1 capability is authored.
  - id: domain_status_gap
    rule: matching accounting domain must remain gap, not approved_mvp, until D12's row moves to inherited.
