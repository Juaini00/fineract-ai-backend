id: loans_capitalized_balances
status: included_mvp_domain
source_doc: docs/data/dataset-inventory.md#5-domain-d--loan
inventory_refs: [LOAN-12]
description: >-
  Capitalized-income and buy-down-fee balance records (D15 disposition,
  dataset-scope-decisions.md:188: "m_loan_capitalized_income_balance,
  m_loan_buy_down_fee_balance ... masuk baseline Loan sebagai sub-area
  balance"), FIN-108 slice 4. Each named table is its own capability and grain.
included_tables:
  - m_loan_capitalized_income_balance
  - m_loan_buy_down_fee_balance
  - m_loan
  - m_loan_transaction
conditional_tables: []
excluded_tables: []
allowed_domains: [loan]
default_rules:
  - loan.loan_capitalized_income_balance reads m_loan_capitalized_income_balance and loan.loan_buy_down_fee_balance reads m_loan_buy_down_fee_balance; one row per balance record (unique loan_id + loan_transaction_id), never joined to each other, never inferred from m_loan flags or balance deltas.
  - is_deleted = true means the source capitalized-income/buy-down-fee transaction was reversed (Apache Fineract LoanAdjustmentServiceImpl); such records, and records whose source transaction is_reversed, are excluded.
  - is_closed = true means amortization finished (fully recognized, or closed/charged off by the amortization processing services); closed records are returned and labelled, not hidden.
  - Amounts are in the owning loan's currency (currency_code per row).
checks:
  - id: office_scope_required
    rule: every approved query binds authorized office_ids through the owning loan's client or group office path.
  - id: reversed_source_excluded
    rule: both balance queries filter is_deleted = false and the source transaction's is_reversed = false.
