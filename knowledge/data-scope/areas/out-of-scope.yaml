id: out_of_scope_areas
status: rejected_group
source_doc: docs/product/2026-09-09-dataset-scope-decisions.md#d13--existing-fineract-reports-di-luar-eksekusi
inventory_refs:
  - D13
description: >-
  Permanently and fully excluded surfaces — never merely uncontracted.
  `address_level_reporting` was removed (FIN-153): client address is
  selective/gap (§1, CLI-6), not policy-forbidden — see
  `knowledge/domains/client.yaml`. `user_audit_reporting` was narrowed to
  application-user administration only: Fineract's own source
  command/action audit (D09) is agreed scope — see
  `knowledge/domains/audit.yaml`.
areas:
  - arbitrary_sql_exploration
  - full_fineract_schema_search
  - document_image_file_reporting
  - identity_document_reporting
  - application_user_administration
  - fineract_write_actions
  - stretchy_report_execution
# FIN-126 (D13): `stretchy_report_execution` had no excluded_tables entry, so
# `catalog::surface::Surfaces` never picked it up — a request naming a
# Fineract stretchy report fell through to ordinary retrieval instead of the
# policy guard. `stretchy_report` is Fineract's own table name and the
# Mifos/Fineract admin UI's own term for this feature (dataset-inventory.md
# D13), so "stretchy report" as a two-token phrase is real vocabulary, not an
# invented one.
excluded_tables:
  - stretchy_report
excluded_phrases:
  - run Fineract report
  - run the Fineract report
  - execute Fineract report
  - execute the Fineract report
  - run report Fineract
  - jalankan report Fineract
  - list Fineract reports
  - show Fineract report
  - tampilkan report Fineract
rule: Out-of-scope areas must produce hard validation failures if referenced by runtime catalog files.
checks:
  - id: rejected_not_runtime
    rule: out-of-scope ids must not be referenced by domains, capabilities, queries, metrics, or schema runtime entries.
  - id: rejected_requests_hard_fail
    rule: user requests matching these areas must map to unsupported_requests_policy.hard_reject.
