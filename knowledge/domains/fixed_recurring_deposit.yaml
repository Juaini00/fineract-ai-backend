id: fixed_recurring_deposit
status: approved_mvp
display_name: Fixed and Recurring Deposit
description: >-
  FD/RD identity, terms, funding, interest, charges/tax, maturity/preclosure,
  transactions, and RD contributions/schedule/shortfall — §2 "FD/RD"
  (dataset-scope-decisions.md:28, :40-58) and dataset-inventory.md
  FDRD-1..10. Five approved Mode-1 capabilities deliver identity/interest (fd_rd_accounts),
  terms/preclosure (fd_rd_term_preclosure), initial activation funding (fd_rd_funding),
  RD expected vs actual contributions (rd_contributions), and RD shortfall (rd_shortfall).
  Shared charges/tax (FDRD-5) and transactions (FDRD-7) stay answered by existing savings
  capabilities (SAV-7/SAV-9, SAV-5). Per-installment RD schedule (FDRD-9) remains a gap intent.
inventory_refs:
  - FDRD-1
  - FDRD-2
  - FDRD-3
  - FDRD-4
  - FDRD-5
  - FDRD-6
  - FDRD-7
  - FDRD-8
  - FDRD-9
  - FDRD-10
data_areas:
  - fixed_recurring_deposit
  - organization_foundation
concepts:
  - id: preclosure
    meaning: Closing a term deposit before its maturity date.
    synonyms: [preclosure, pre-closure, pencairan dini]
supported_intents:
  - { phrase: "fixed and recurring deposit accounts in authorized offices", inventory_ref: FDRD-1 }
  - { phrase: "fixed and recurring deposit terms and preclosure details", inventory_ref: FDRD-2 }
  - { phrase: "fixed deposit funding", inventory_ref: FDRD-3 }
  - { phrase: "fixed and recurring deposit interest terms", inventory_ref: FDRD-4 }
  - { phrase: "fixed deposit preclosure", inventory_ref: FDRD-6 }
  - { phrase: "recurring deposit contribution", inventory_ref: FDRD-8 }
  - { phrase: "recurring deposit shortfall", inventory_ref: FDRD-10 }
gap_intents:
  - { phrase: "recurring deposit installment schedule", inventory_ref: FDRD-9 }
unsupported_intents:
  - { phrase: "create fixed deposit account", exempt: "write_action" }
  - { phrase: "create recurring deposit account", exempt: "write_action" }
default_rules:
  - Maturity amount is a projection, never payout evidence; maturity date is a projected date, not an event (§2 FD/RD rule; scope-decisions :40-58).
  - Closure instruction (on_account_closure_enum) is distinct from evidenced payout or transfer; never derive a reinvestment chain without an FK or evidence path.
  - Fixed deposits have no periodic installment schedule — never impose a periodic schedule on FD (FDRD-4).
  - Recurring deposit shortfall (total_overdue_amount) is strictly distinct from loan arrears (FDRD-10).
  - Schedule is not an event (same rule as LOAN-5); FDRD-9 returns frequency and calendar linkage only, never invented per-installment rows. Standalone per-installment schedule remains a gap intent.
  - Shared rows FDRD-5 (charges/tax) and FDRD-7 (transactions/relations) stay answered by existing savings capabilities (SAV-7/SAV-9, SAV-5) without duplication.
  - Account-number masking follows the savings convention; account_no and external_id are never returned.
  - Office authorization path is the client's office (m_client.office_id); transaction office is evidence only.
  - "FDRD-2 (terms/maturity) is the one row an existing approved capability touches (`savings/deposit_maturity_by_client`) — `maturity`/`fixed deposit`/`recurring deposit` are deliberately NOT this domain's own concept synonyms: they already belong to that capability's vocabulary, and adding them here would risk shadowing a working answer instead of only catching the genuinely uncovered rows above."
checks:
  - id: data_area_exists
    rule: data_areas must reference fixed_recurring_deposit.
  - id: maturity_is_projected
    rule: maturity_amount is labeled as a projection, never payout evidence.
  - id: shortfall_distinct_from_arrears
    rule: RD shortfall is distinct from loan arrears.
  - id: no_account_numbers
    rule: account_no and external_id are never selected.
  - id: office_path_scoped
    rule: authorization is scoped through m_client.office_id.
