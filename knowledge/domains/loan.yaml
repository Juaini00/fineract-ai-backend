id: loan
status: gap
display_name: Loan
description: >-
  Loan portfolio per §1 baseline (dataset-scope-decisions.md:26) and
  dataset-inventory.md LOAN-1..12 — identity/relations, lifecycle, effective
  terms, staged disbursement, schedule vs paid/outstanding, transactions and
  allocations, charges, balances, arrears/delinquency, collateral/guarantor,
  reschedule/write-off/recovery, and D15's capitalized-income/buy-down-fee
  balances. Agreed baseline scope; no approved Mode-1 capability exists yet
  (dataset-inventory.md: every LOAN-* row is `gap`).
inventory_refs:
  - LOAN-1
  - LOAN-2
  - LOAN-3
  - LOAN-4
  - LOAN-5
  - LOAN-6
  - LOAN-7
  - LOAN-8
  - LOAN-9
  - LOAN-10
  - LOAN-11
  - LOAN-12
data_areas:
  - loans
concepts:
  - id: loan
    meaning: Credit account extended to a client or group.
    synonyms: [loan, credit, kredit, pinjaman]
  - id: disbursement
    meaning: Funds released to the borrower at loan origination.
    synonyms: [disbursement, payout, pencairan]
  - id: repayment
    meaning: Borrower payment that reduces outstanding principal or interest.
    synonyms: [repayment, installment, angsuran, pembayaran]
  - id: arrears
    meaning: Overdue installments past their due date.
    synonyms: [arrears, overdue, delinquent, tunggakan]
  - id: write_off
    meaning: Charge-off of uncollectible loan balance.
    synonyms: [write off, write-off, charge off]
supported_intents: []
gap_intents:
  - loan disbursement totals
  - loan repayment totals
  - largest outstanding loans
  - arrears summary
unsupported_intents:
  - create loan account
  - disburse loan
  - reverse loan transaction
default_rules:
  - Loan is agreed baseline scope with no approved capability yet (dataset-inventory.md LOAN-1..12, every row `gap`); every loan-related request answers unsupported with a gap reason, never routed to an unrelated approved capability (mis. savings).
checks:
  - id: gap_domain_no_approved_capability
    rule: this domain must not have approved_mvp capabilities until a Mode-1 capability is authored and the inventory rows it covers move to `inherited`.
  - id: loan_tables_not_runtime
    rule: loan data areas must not be referenced by approved_mvp queries.
