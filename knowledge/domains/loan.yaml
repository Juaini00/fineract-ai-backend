id: loan
status: approved_mvp
display_name: Loan
description: >-
  Loan portfolio per §1 baseline (dataset-scope-decisions.md:26) and
  dataset-inventory.md LOAN-1..12. FIN-108 approves loan identity, recorded
  lifecycle, effective terms (LOAN-1..3), repayment schedule (LOAN-5, planned
  only), transactions with allocation (LOAN-6, reversals excluded by
  default), charges/penalties with charged-vs-collected separation (LOAN-7),
  outstanding balances read from m_loan's own derived columns (LOAN-8), and
  arrears/delinquency snapshots with an as-of signal (LOAN-9, XR-ASOF).
  Disbursement, collateral/guarantor, reschedule/write-off/recovery and D15
  balances remain `gap` and answer Unsupported through gap_intents below,
  never through an unrelated capability.
inventory_refs:
  - LOAN-1
  - LOAN-2
  - LOAN-3
  - LOAN-4
  - LOAN-5
  - LOAN-6
  - LOAN-7
  - LOAN-8
  - LOAN-9
  - LOAN-10
  - LOAN-11
  - LOAN-12
  - D01
  - D03
  - D11
data_areas:
  - loans_identity
  - loans_servicing
  - loans_charges_balances
  - loans
# `concepts` dulu memuat kosakata umum loan (arrears, write-off,
# disbursement, repayment...) supaya domain yang sepenuhnya gap dikenali
# DeferredDomains lewat jalur `is_uncontracted`. Sejak FIN-108 loan
# berstatus `approved_mvp`, jalur itu tidak lagi memakainya, dan
# mempertahankannya justru berbahaya: build() menambahkan kosakata
# domain-approved ke `excluded`, yang akan membatalkan gap_intents di
# bawah (mis. "write off" terhapus dari guard LOAN-11 oleh concept
# "write-off" miliknya sendiri). Setiap subjek yang masih gap sekarang hanya dijaga
# lewat gap_intents per baris inventaris, bukan kosakata domain generik.
supported_intents:
  - { phrase: "list every loan account of one client with status", inventory_ref: LOAN-1 }
  - { phrase: "loan count by recorded status", inventory_ref: LOAN-2 }
  - { phrase: "loan account terms beside product default", inventory_ref: LOAN-3 }
  - { phrase: "loan repayment schedule, planned not actual", inventory_ref: LOAN-5 }
  - { phrase: "loan transactions with allocation, reversals excluded by default", inventory_ref: LOAN-6 }
  - { phrase: "loan charges/penalties with charged vs paid/waived/written-off/outstanding separated", inventory_ref: LOAN-7 }
  - { phrase: "outstanding loan balances read from recorded derived columns", inventory_ref: LOAN-8 }
  - { phrase: "loans in arrears with overdue amounts and as-of date", inventory_ref: LOAN-9 }
gap_intents:
  - { phrase: "loan disbursement", inventory_ref: LOAN-4 }
  - { phrase: "pencairan", inventory_ref: LOAN-4 }
  - { phrase: "dicairkan", inventory_ref: LOAN-4 }
  - { phrase: "disbursed amount", inventory_ref: LOAN-4 }
  - { phrase: "guarantor", inventory_ref: LOAN-10 }
  - { phrase: "penjamin", inventory_ref: LOAN-10 }
  - { phrase: "write off", inventory_ref: LOAN-11 }
  - { phrase: "write-off", inventory_ref: LOAN-11 }
  - { phrase: "charge off", inventory_ref: LOAN-11 }
  - { phrase: "reschedule", inventory_ref: LOAN-11 }
  - { phrase: "loan recovery", inventory_ref: LOAN-11 }
  - { phrase: "capitalized income", inventory_ref: LOAN-12 }
  - { phrase: "buy down fee", inventory_ref: LOAN-12 }
unsupported_intents:
  - { phrase: "create loan account", exempt: "write_action" }
  - { phrase: "disburse loan", exempt: "write_action" }
  - { phrase: "reverse loan transaction", exempt: "write_action" }
default_rules:
  - Approved loan capabilities read m_loan, m_loan_repayment_schedule, m_loan_transaction, m_loan_charge and m_loan_arrears_aging (LOAN-1..3, 5..9); every other loan subject is `gap` and answers unsupported with a gap reason (dataset-inventory.md LOAN-4, 10..12).
  - A client's loans include every status; never default to active (§1 rule 29).
  - Effective terms are the loan row's own; the product's current default is shown beside them, never substituted.
  - "D01/D03/D11 apply to loan facts the same way they apply to savings: no reproduce-published-report branch, no cross-currency consolidation, completeness breakdowns distinct from a plain aggregate."
checks:
  - id: unservicing_facts_remain_gap
    rule: loan tables outside loans_identity/loans_servicing/loans_charges_balances (collateral, disbursement detail, write-off/recovery) must not be referenced by approved queries until their rows move to inherited.
