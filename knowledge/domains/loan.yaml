id: loan
status: approved_mvp
display_name: Loan
description: >-
  Loan portfolio per §1 baseline (dataset-scope-decisions.md:26) and
  dataset-inventory.md LOAN-1..12. FIN-108 approves loan identity, recorded
  lifecycle and effective terms (LOAN-1..3) read from m_loan. Disbursement,
  schedule, transactions, charges, balances, arrears, collateral/guarantor,
  reschedule/write-off/recovery and D15 balances remain `gap` and answer
  Unsupported through gap_intents below, never through an unrelated capability.
inventory_refs:
  - LOAN-1
  - LOAN-2
  - LOAN-3
  - LOAN-4
  - LOAN-5
  - LOAN-6
  - LOAN-7
  - LOAN-8
  - LOAN-9
  - LOAN-10
  - LOAN-11
  - LOAN-12
  - D01
  - D03
  - D11
data_areas:
  - loans_identity
  - loans
concepts:
  - id: loan
    meaning: Credit account extended to a client or group.
    synonyms: [loan, credit, kredit, pinjaman]
  - id: disbursement
    meaning: Funds released to the borrower at loan origination.
    synonyms: [disbursement, payout, pencairan]
  - id: repayment
    meaning: Borrower payment that reduces outstanding principal or interest.
    synonyms: [repayment, installment, angsuran, pembayaran]
  - id: arrears
    meaning: Overdue installments past their due date.
    synonyms: [arrears, overdue, delinquent, tunggakan]
  - id: write_off
    meaning: Charge-off of uncollectible loan balance.
    synonyms: [write off, write-off, charge off]
supported_intents:
  - { phrase: "list every loan account of one client with status", inventory_ref: LOAN-1 }
  - { phrase: "loan count by recorded status", inventory_ref: LOAN-2 }
  - { phrase: "loan account terms beside product default", inventory_ref: LOAN-3 }
gap_intents:
  - { phrase: "loan disbursement", inventory_ref: LOAN-4 }
  - { phrase: "pencairan", inventory_ref: LOAN-4 }
  - { phrase: "dicairkan", inventory_ref: LOAN-4 }
  - { phrase: "disbursed amount", inventory_ref: LOAN-4 }
  - { phrase: "repayment schedule", inventory_ref: LOAN-5 }
  - { phrase: "installment", inventory_ref: LOAN-5 }
  - { phrase: "jadwal angsuran", inventory_ref: LOAN-5 }
  - { phrase: "angsuran", inventory_ref: LOAN-5 }
  - { phrase: "loan transaction", inventory_ref: LOAN-6 }
  - { phrase: "transaksi pinjaman", inventory_ref: LOAN-6 }
  - { phrase: "loan repayment", inventory_ref: LOAN-6 }
  - { phrase: "repayment", inventory_ref: LOAN-6 }
  - { phrase: "loan charge", inventory_ref: LOAN-7 }
  - { phrase: "loan penalty", inventory_ref: LOAN-7 }
  - { phrase: "outstanding loan", inventory_ref: LOAN-8 }
  - { phrase: "loan outstanding", inventory_ref: LOAN-8 }
  - { phrase: "loan balance", inventory_ref: LOAN-8 }
  - { phrase: "saldo pinjaman", inventory_ref: LOAN-8 }
  - { phrase: "outstanding pinjaman", inventory_ref: LOAN-8 }
  - { phrase: "arrears", inventory_ref: LOAN-9 }
  - { phrase: "overdue", inventory_ref: LOAN-9 }
  - { phrase: "delinquent", inventory_ref: LOAN-9 }
  - { phrase: "tunggakan", inventory_ref: LOAN-9 }
  - { phrase: "guarantor", inventory_ref: LOAN-10 }
  - { phrase: "penjamin", inventory_ref: LOAN-10 }
  - { phrase: "write off", inventory_ref: LOAN-11 }
  - { phrase: "write-off", inventory_ref: LOAN-11 }
  - { phrase: "charge off", inventory_ref: LOAN-11 }
  - { phrase: "reschedule", inventory_ref: LOAN-11 }
  - { phrase: "loan recovery", inventory_ref: LOAN-11 }
  - { phrase: "capitalized income", inventory_ref: LOAN-12 }
  - { phrase: "buy down fee", inventory_ref: LOAN-12 }
unsupported_intents:
  - { phrase: "create loan account", exempt: "write_action" }
  - { phrase: "disburse loan", exempt: "write_action" }
  - { phrase: "reverse loan transaction", exempt: "write_action" }
default_rules:
  - Approved loan capabilities read m_loan only (LOAN-1..3); every other loan subject is `gap` and answers unsupported with a gap reason (dataset-inventory.md LOAN-4..12).
  - A client's loans include every status; never default to active (§1 rule 29).
  - Effective terms are the loan row's own; the product's current default is shown beside them, never substituted.
  - "D01/D03/D11 apply to loan facts the same way they apply to savings: no reproduce-published-report branch, no cross-currency consolidation, completeness breakdowns distinct from a plain aggregate."
checks:
  - id: servicing_facts_remain_gap
    rule: loan servicing tables (schedule, transactions, charges, arrears) must not be referenced by approved queries until their rows move to inherited.
