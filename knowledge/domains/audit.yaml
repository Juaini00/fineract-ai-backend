id: audit
status: gap
display_name: Fineract source audit
description: >-
  Fineract's own operational command/action audit — actor, action, and
  evidenced reason for a command against a business resource
  (`m_portfolio_command_source`), per D09
  (dataset-scope-decisions.md:128-134) and dataset-inventory.md D09. Distinct
  from Jarvis's own execution audit (`audit_events`, database-design.md I8,
  never exposed as a business-analytics surface) and from raw command
  JSON/payload, both of which stay out of scope. User/role/permission
  administration (`m_appuser`, `m_role`, `m_permission`) also stays out of
  scope (D15, non-analytic). Agreed baseline scope for the source-audit
  surface; no approved Mode-1 capability exists yet.
inventory_refs:
  - D09
data_areas:
  - source_audit
concepts:
  - id: source_audit
    meaning: Fineract's own recorded command/action against a business resource, with its actor and evidenced reason.
    synonyms: [source audit, audit trail, command source, jejak audit]
supported_intents: []
gap_intents:
  - { phrase: "who performed this action", inventory_ref: D09 }
  - { phrase: "reason recorded for this action", inventory_ref: D09 }
  - { phrase: "siapa membebaskan biaya", inventory_ref: D09 }
  - { phrase: "alasan yang tercatat", inventory_ref: D09 }
unsupported_intents:
  - raw command payload
  - jarvis execution audit log
  - application user administration
default_rules:
  - Fineract's own source audit (m_portfolio_command_source) is agreed baseline scope (D09, dataset-inventory.md D09 `gap`) with no approved capability yet; it answers unsupported with a gap reason.
  - This is distinct from user/role/permission administration (still excluded, D15 non-analytic) and from Jarvis's own execution audit (database-design.md I8) or raw command payload, neither of which ever becomes gap or supported scope.
checks:
  - id: gap_domain_no_approved_capability
    rule: this domain must not have approved_mvp capabilities until a Mode-1 capability is authored and D09's row moves to `inherited`.
  - id: source_audit_distinct_from_raw_payload
    rule: gap_intents and supported_intents must never include raw command JSON or payload access.
