id: teller_cashier
status: gap
display_name: Teller and cashier cash operations
description: >-
  Cashier/teller assignment and cash position — §1 rule + D06
  (dataset-scope-decisions.md:104-110) and dataset-inventory.md D06. Cashier
  and teller assignment tables exist (`m_cashiers`, `m_tellers`); no
  cash-movement/reconciliation table exists in the current schema (verified
  missing, dataset-inventory.md §11) — cash position/reconciliation stays
  `gap` with no candidate table, not merely unverified. Agreed baseline scope
  for assignment; no approved Mode-1 capability exists yet.
inventory_refs:
  - D06
data_areas: []
concepts:
  - id: teller
    meaning: A till/counter Fineract cash transactions are recorded against.
    synonyms: [teller assignment, cashier assignment]
supported_intents: []
gap_intents:
  - teller assignment
  - cashier assignment
unsupported_intents:
  - open teller shift
  - close teller shift
default_rules:
  - Cashier/teller assignment (D06) is agreed baseline scope with no approved capability yet; it answers unsupported with a gap reason.
  - Cash position/reconciliation has no candidate table in this schema (verified missing) — a future capability cannot promise it without a new decision; recorded cash is never asserted as physical cash.
checks:
  - id: gap_domain_no_approved_capability
    rule: this domain must not have approved_mvp capabilities until a Mode-1 capability is authored and D06's row moves to inherited.
