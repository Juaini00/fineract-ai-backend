id: client
status: approved_mvp
display_name: Client
description: >-
  Client ownership context across every account type the client holds, per §1
  baseline ("Client/kepemilikan ... dan seluruh jenis account") and
  dataset-inventory.md CLI-1..8. Identity, lifecycle, and office/staff
  assignment (CLI-1..3) are approved Mode-1 capabilities. Direct client
  charge assessments and payment allocations (D04) are approved Mode-1
  capabilities (`client_charge_assessments`, `client_charge_payment_allocations`).
  Client group and center membership (CLI-4) is approved (`client_group_membership`).
  The client's full account roster spans loan, savings, and share (CLI-5) and is
  approved via `client_account_roster` (with `clients_with_account_counts` covering
  the savings-only summary). Contact/address (CLI-6) is selectively agreed and
  approved via `client_address` under PII sensitivity class gating.
inventory_refs:
  - CLI-1
  - CLI-2
  - CLI-3
  - CLI-4
  - CLI-5
  - CLI-6
  - CLI-7
  - D02
  - D04
  - D15d
concepts:
  - id: client
    meaning: Customer or member in Fineract.
    synonyms: [client, customer, member, account holder]
  - id: group_membership
    meaning: Client membership in groups and centers.
    synonyms:
      - client group
      - client groups
      - group membership
      - group memberships
      - client center
      - client centers
      - center membership
      - center memberships
      - group name
      - group office
      - keanggotaan kelompok
      - keanggotaan group
      - group nasabah
supported_intents:
  - { phrase: "client identity resolve and name lookup", inventory_ref: CLI-1 }
  - { phrase: "client lifecycle summary", inventory_ref: CLI-2 }
  - { phrase: "active pending and closed client counts by authorized office scope", inventory_ref: CLI-3 }
  - { phrase: "client charge assessments", inventory_ref: D04 }
  - { phrase: "client charge payment allocations", inventory_ref: D04 }
  - { phrase: "client group and center membership", inventory_ref: CLI-4 }
  - { phrase: "full account roster across loan savings and share account types", inventory_ref: CLI-5 }
  - { phrase: "client contact and address", inventory_ref: CLI-6 }
gap_intents:
  - { phrase: "family member detail", inventory_ref: D15d }
  - { phrase: "historical office as of a past date", inventory_ref: D02 }
unsupported_intents:
  - { phrase: "identity document reporting", exempt: "excluded_by_design_gap_row_nuance" }
default_rules:
  - Client identity output requires explicit capability approval.
  - Group and center membership (CLI-4) is approved under client_group_membership; authorization follows the client's office with group office surfaced as evidence only.
  - All account types owned by a client (loan, savings, share) are agreed baseline scope (CLI-5) and approved via client_account_roster; clients_with_account_counts remains the savings-count summary.
  - Client address/contact is selectively agreed (§1), not default-on, and approved via client_address behind the PII sensitivity class (CLI-6).
  - Direct client charges (D04, `m_client_charge`/`m_client_charge_paid_by`) are approved capabilities under `client_charge_assessments` and `client_charge_payment_allocations`; master definition is separated from actual assessment, payment allocations avoid fan-out, and NULL derived amounts stay NULL. Absence of charges is not evidence of delinquency.
  - Family member detail (D15d, `m_family_members`) is selective/not-default, same pattern as CLI-6/CLI-8; it answers unsupported with a gap reason, not a hard policy rejection.
  - Historical branch attribution (D02) is agreed scope only where a history table exists; none does today (verified negative, dataset-inventory.md D02) — every domain row above is current-office only. A request explicitly asking for the office as of a past date must answer unsupported with a gap reason, never silently answer with the current office as if it were historical.
  - "Identity document reporting (CLI-7) is marked `exempt`, not cited against CLI-7 directly: the row's inventory category normalizes to `gap`, but its own acceptance text is stronger than that — \"excluded by default; row exists only to record the exclusion\", \"not to be closed by a capability without a new decision\" — a permanent, by-design hard exclusion, the same shape as D13, not a merely-uncontracted item like address (CLI-6). Citing CLI-7 as a `gap_intents`/`unsupported_intents` ref would force a category (`gap` or `excluded`) neither of which fully matches this row's own nuance; `exempt` states that honestly instead of picking the wrong one."
checks:
  - id: data_area_exists
    rule: data_areas must reference client_foundation.
  - id: pii_safe_default
    rule: client identity concepts must not become output fields unless a capability explicitly allows them.
  - id: address_not_hard_rejected
    rule: unsupported_intents must not contain 'address-level reporting' — address is selective/gap (CLI-6), not policy-forbidden.
  - id: all_account_types_declared
    rule: supported_intents must acknowledge the full account roster across loan and share sides of CLI-5.
