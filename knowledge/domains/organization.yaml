id: organization
status: approved_mvp
display_name: Organization
description: Office and branch context used for office-scoped reporting.
inventory_refs:
  - ORG-1
  - ORG-3
data_areas:
  - organization_foundation
concepts:
  - id: office
    meaning: Organization unit used to scope reports.
    synonyms: [office, branch, location, organization unit]
supported_intents:
  - { phrase: "office scoped reporting", inventory_ref: ORG-1 }
  - { phrase: "office summary", inventory_ref: ORG-1 }
  - { phrase: "active staff count by authorized office scope", inventory_ref: ORG-1 }
unsupported_intents:
  - { phrase: "create office", exempt: "write_action" }
  - { phrase: "update office", exempt: "write_action" }
default_rules:
  - Organization knowledge supports office-scoped reporting only; it does not grant write access.
checks:
  - id: data_area_exists
    rule: data_areas must reference organization_foundation.
  - id: no_write_intents
    rule: supported_intents must not include create, update, delete, or administrative office changes.
