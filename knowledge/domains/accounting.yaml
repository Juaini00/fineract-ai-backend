id: accounting
status: approved_mvp
display_name: Accounting
description: >-
  General ledger traceability per D12 (dataset-scope-decisions.md:156-164) —
  journal entries per transaction/account and the balance/movement of one
  named GL account (`acc_gl_journal_entry`, `acc_gl_account`). Full trial
  balance, balance sheet, and profit-and-loss reports are explicitly and
  permanently out of scope (D12's own boundary), never merely uncontracted —
  they must not appear in supported_intents or gap_intents. Agreed baseline
  scope for the single-account case delivered as Mode-1 capabilities (FIN-112).
inventory_refs:
  - D12
data_areas:
  - accounting_gl
concepts:
  - id: journal_entry
    meaning: A double-entry posting to general ledger accounts.
    synonyms: [journal entry, gl entry, posting, jurnal]
  - id: gl_account
    meaning: An account in the chart of accounts.
    synonyms: [gl account, ledger account, chart of accounts, akun]
  - id: closure
    meaning: Period-end ledger closure for accounting periods.
    synonyms: [closure, period close, tutup buku]
supported_intents:
  - { phrase: "general ledger balance for one named account", inventory_ref: D12 }
  - { phrase: "journal entries for one account or transaction", inventory_ref: D12 }
  - { phrase: "balance and turnover for general ledger accounts", inventory_ref: D12 }
gap_intents: []
default_rules:
  - "Single named GL account traceability is approved Mode-1 scope (D12, FIN-112): journal entries per account, journal entries per transaction, and balance/turnover aggregation for one named GL account."
  - "Trial balance, balance sheet, and profit-and-loss reports are excluded by D12 itself, not merely uncontracted — never add them to gap_intents or supported_intents; they belong in unsupported_intents only."
  - "Reversal exclusion (§31 anti-double-count): gl_account_balance excludes reversed entries and paired reversal entries from sums; entry_count, reversed_entry_count, and reversal_entry_count are reported separately."
unsupported_intents:
  - { phrase: "post journal entry", exempt: "write_action" }
  - { phrase: "create gl account", exempt: "write_action" }
  - { phrase: "close accounting period", exempt: "write_action" }
  - { phrase: "trial balance", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "balance sheet", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "profit and loss report", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "full financial statements", exempt: "excluded_subclause_no_row_id" }
checks:
  - id: office_scope_bound
    rule: every accounting query must bind authorized office scope.
  - id: reversal_exclusion_honored
    rule: balance queries must exclude reversed and reversal entries from sums to prevent double counting.
  - id: full_statement_stays_excluded
    rule: trial balance, balance sheet, and profit-and-loss must remain in unsupported_intents (D12 boundary) and never move to supported_intents or gap_intents.
