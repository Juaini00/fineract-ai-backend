id: provisioning
status: approved_mvp
display_name: Loan loss provisioning results
description: >-
  Actual provisioning results (criteria applied to real outstanding loans),
  distinct from the provisioning-criteria config already read as a supporting
  reference under `organization` (ORG-7) — D07
  (dataset-scope-decisions.md:112-118) and dataset-inventory.md D07.
  Delivered as two Mode-1 curated capabilities: provisioning run history (org-wide)
  and recorded provisioning entries per office/product/category (FIN-116).
  Never simulates or projects provisioning, never multiplies current criteria % by
  historical outstanding, and never synthesizes loan-level contributors.
inventory_refs:
  - D07
data_areas:
  - provisioning
concepts:
  - id: provisioning_result
    meaning: A recorded provisioning entry or history run, using the criteria actually applied.
    synonyms: [provisioning result, provisioning history, hasil provisi, hasil pencadangan, entri provisi]
supported_intents:
  - { phrase: "provisioning run history", inventory_ref: D07 }
  - { phrase: "recorded provisioning runs", inventory_ref: D07 }
  - { phrase: "provisioning entries in authorized offices", inventory_ref: D07 }
  - { phrase: "recorded provisioning entries", inventory_ref: D07 }
  - { phrase: "tampilkan riwayat proses provisioning", inventory_ref: D07 }
  - { phrase: "tampilkan rincian entri provisi per produk dan kategori", inventory_ref: D07 }
gap_intents: []
unsupported_intents:
  - { phrase: "create provisioning entry", exempt: "write_action" }
  - { phrase: "simulate provisioning", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "project provisioning", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "recompute provisioning from current criteria", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "largest contributing loans to provisioning", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "pinjaman penyumbang terbesar provisi", exempt: "excluded_subclause_no_row_id" }
  - { phrase: "approve provisioning to general ledger", exempt: "excluded_subclause_no_row_id" }
default_rules:
  - "Actual provisioning results (D07) read recorded history and entries as stored; simulation and projection are strictly forbidden."
  - "Multiplying current provisioning criteria percentages by historical loan outstanding is strictly forbidden (D07 own rule)."
  - "Loan-level contributor details do not exist in D07 tables; requests asking for contributing loans remain unsupported."
  - "No GL consolidation or full-GL approval across the general ledger."
checks:
  - id: approved_domain_has_capabilities
    rule: approved domain must declare approved_mvp capabilities in knowledge/capabilities/provisioning.
  - id: no_simulation_or_recomputation
    rule: simulation, recomputation, and loan contributor synthesis are declared unsupported.
