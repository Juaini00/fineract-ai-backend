id: group_center
status: approved_mvp
display_name: Group and Center
# FIN-117: flipped from `candidate` — dataset-inventory.md CLI-4 already
# recorded this deployment's evidenced use of group/center (2 groups, one at
# each level, verified). That evidence is the "deployment verifies the
# underlying area" default_rules asked for, so group_center_foundation's own
# status moves conditional -> enabled alongside this flip
# (knowledge/data-scope/areas/group-center-foundation.yaml), and the D08
# meeting-schedule capability (`group_center_meeting_schedule`) is the first
# capability this evidence actually activates (query_id
# group.group_center_meeting_schedule). Everything this domain does not yet
# have a capability for (CLI-4 account summaries beyond savings, D08
# realization/attendance) stays in `gap_intents` below and now resolves to
# `domain_gap` rather than `domain_conditional_not_enabled` — the accurate
# reason once the domain itself is active: agreed-but-uncontracted, not
# unverified.
description: >-
  Group-based and center-based organizational context per §1 baseline
  ("group/center jika digunakan") and dataset-inventory.md CLI-4 — a client's
  group/center membership and all account types (loan, savings, share), not
  savings alone. The approved D08 capability returns dated meeting schedules,
  responsible staff IDs and direct member IDs. Group identity resolution
  remains candidate; account summaries and meeting realization/attendance
  remain agreed scope without approved capabilities.
inventory_refs:
  - CLI-4
  - D08
data_areas:
  - group_center_foundation
concepts:
  - id: group
    meaning: A collection of clients managed together (e.g. group lending).
    synonyms: [group, lending group, kelompok]
  - id: center
    meaning: A higher-level grouping that contains multiple groups.
    synonyms: [center, centre, pusat]
supported_intents: []
gap_intents:
  - { phrase: "group savings summary", inventory_ref: CLI-4 }
  - { phrase: "group loan summary", inventory_ref: CLI-4 }
  - { phrase: "center savings summary", inventory_ref: CLI-4 }
  - { phrase: "center loan summary", inventory_ref: CLI-4 }
  - { phrase: "group meeting attendance", inventory_ref: D08 }
unsupported_intents:
  - { phrase: "create group", exempt: "write_action" }
  - { phrase: "assign client to group", exempt: "write_action" }
default_rules:
  - FIN-117 evidenced this local deployment uses group_center_foundation (dataset-inventory.md CLI-4: 2 groups, one at each level) so the domain moved out of `candidate`; a deployment without that evidence must keep this domain `candidate` and answer unsupported with a conditional-not-enabled reason instead.
  - Group/center scope covers every account type a member may hold (CLI-4/CLI-5), not savings alone; the D08 meeting schedule is the only approved group capability today — any group/center-scoped account summary answers unsupported with a gap reason rather than being misrouted to office-wide savings.
  - "`group_identity_resolve` remains candidate: CLI-4's Capability column says \"group only, not client→group linkage\" (dataset-inventory.md CLI-4), so supported_intents stays empty rather than claiming client membership resolution."
  - Group/center meeting schedule (D08) is an approved capability, `group_center_meeting_schedule` (FIN-117); both group/center calendars are verified meeting type with FREQ=DAILY and are expanded to scheduled dates in the requested week. `m_group.display_name` is pii and is not returned. Realization/attendance has zero source rows (`m_meeting` and `m_client_attendance`) and stays a gap_intent — a schedule is not evidence of occurrence.
checks:
  - id: conditional_domain
    rule: a deployment that has not evidenced group/center use (no verified dataset-inventory.md row) must keep this domain candidate; this deployment's status flip is that evidence, recorded above and in knowledge/VERIFICATION.md.
  - id: no_mvp_capability_by_default
    rule: approved_mvp capabilities must not require group_center unless explicitly enabled.
  - id: not_savings_only
    rule: supported_intents/gap_intents must not claim group/center account reporting is limited to savings — CLI-4/CLI-5 cover every account type.
