id: savings
status: approved_mvp
display_name: Savings
description: Savings account and transaction reporting.
inventory_refs:
  - SAV-1
  - SAV-2
  - SAV-3
  - SAV-4
  - SAV-5
  - SAV-6
  - SAV-7
  - SAV-8
  - SAV-9
  - SAV-10
  - SAV-11
  - D01
  - D03
  - D11
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
concepts:
  - id: deposit
    meaning: Money credited into a savings account.
    # "credit"/"kredit" juga synonym konsep `loan` di loan.yaml — istilah
    # ambigu ini dibuang dari kosakata domain deferred (FIN-140) supaya
    # pertanyaan savings yang sah tidak ikut ditolak.
    synonyms: [deposit, money in, credit, savings credit, kredit]
  - id: withdrawal
    meaning: Money debited from a savings account.
    synonyms: [withdrawal, money out, debit, savings debit]
  - id: savings_account
    meaning: Customer or group savings account.
    synonyms: [savings, savings account, deposit account]
  - id: withholding_tax
    meaning: Withheld tax on savings accounts.
    synonyms: [withholding tax, withheld tax, pemotongan pajak]
supported_intents:
  - { phrase: "savings deposit totals", inventory_ref: SAV-5 }
  - { phrase: "largest savings deposits", inventory_ref: SAV-5 }
  - { phrase: "savings account lifecycle and dormant or block status", inventory_ref: SAV-2 }
  - { phrase: "savings account balance detail with available and on-hold funds", inventory_ref: SAV-4 }
  - { phrase: "savings transactions by type breakdown", inventory_ref: SAV-5 }
  - { phrase: "savings interest earned vs posted position", inventory_ref: SAV-6 }
  - { phrase: "savings account holds and lien transactions", inventory_ref: SAV-8 }
  - { phrase: "savings accounts with applied withholding tax", inventory_ref: SAV-9 }
  - { phrase: "savings linked accounts and portfolio associations", inventory_ref: SAV-10 }
gap_intents:
  - { phrase: "consolidated total across currencies", inventory_ref: D03 }
unsupported_intents:
  - { phrase: "reproduce the published report", exempt: "dataset-scope-decisions.md:16" }
  - { phrase: "as published saat penutupan", exempt: "dataset-scope-decisions.md:16" }
  - { phrase: "create savings account", exempt: "write_action" }
  - { phrase: "reverse transaction", exempt: "write_action" }
default_rules:
  - Exclude reversed transactions unless explicitly requested by an approved capability.
  - "D01: reproducing a previously published report exactly as it was is out of scope by owner decision (dataset-scope-decisions.md:16) — only current, recomputed-as-of-today balances are approved. A request explicitly asking to reproduce a published report must answer unsupported with a gap reason, never silently recomputed and presented as the published figure."
  - "D03: no exchange-rate table exists (verified negative, dataset-inventory.md D03) — a request for a currency-consolidated total must answer unsupported with a gap reason, never silently summed across currencies."
  - "D11: a completeness/unclassified-record breakdown is a distinct request from a plain aggregate; until a capability declares that grouping explicitly, it answers unsupported with a gap reason rather than an aggregate that silently drops the unclassified rows."
checks:
  - id: data_areas_exist
    rule: all savings data_areas must exist under knowledge/data-scope/areas.
  - id: approved_intents_have_capabilities
    rule: supported MVP savings intents must map to approved capabilities.
  - id: unsupported_intents_not_executable
    rule: write/reversal intents must not map to approved_mvp capabilities.
