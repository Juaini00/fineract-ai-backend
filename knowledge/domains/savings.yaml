id: savings
status: approved_mvp
display_name: Savings
description: Savings account and transaction reporting.
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
concepts:
  - id: deposit
    meaning: Money credited into a savings account.
    # "credit"/"kredit" juga synonym konsep `loan` di loan.yaml — istilah
    # ambigu ini dibuang dari kosakata domain deferred (FIN-140) supaya
    # pertanyaan savings yang sah tidak ikut ditolak.
    synonyms: [deposit, money in, credit, savings credit, kredit]
  - id: withdrawal
    meaning: Money debited from a savings account.
    synonyms: [withdrawal, money out, debit, savings debit]
  - id: savings_account
    meaning: Customer or group savings account.
    synonyms: [savings, savings account, deposit account]
supported_intents:
  - savings deposit totals
  - largest savings deposits
unsupported_intents:
  - create savings account
  - reverse transaction
default_rules:
  - Exclude reversed transactions unless explicitly requested by an approved capability.
checks:
  - id: data_areas_exist
    rule: all savings data_areas must exist under knowledge/data-scope/areas.
  - id: approved_intents_have_capabilities
    rule: supported MVP savings intents must map to approved capabilities.
  - id: unsupported_intents_not_executable
    rule: write/reversal intents must not map to approved_mvp capabilities.
