# cargo-deny — audit rantai pasok. Jalankan: `cargo deny check`.
# CI menjalankan `check advisories bans licenses sources`.

[advisories]
version = 2
yanked = "warn"
# Sengaja KOSONG. Repo lama membawa daftar ignore untuk advisory yang berasal
# dari dependency yang belum tentu ada di sini. Menyalin suppression untuk
# masalah yang mungkin tidak kita punya akan menyembunyikan yang sungguhan.
# Tambahkan entri hanya setelah `cargo deny check` benar-benar mengeluhkannya,
# beserta alasan dan kapan harus ditinjau ulang.
ignore = []

[bans]
multiple-versions = "warn"
# Wildcard umum pada graf transitif; beri peringatan, jangan blokir.
wildcards = "warn"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MITNFA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
