      value: application/json
    - name: authorization
      value: "Bearer {{retrievalVectorToken}}"
    - name: Idempotency-Key
      value: "{{retrievalVectorKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{retrievalVectorSession}}", "request_text": "Hitung penerimaan simpanan sepanjang rentang ini" }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("retrievalVectorKey", "retrieval-vector-" + Date.now());
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("retrievalVectorJob", res.getBody().data.job_id);
