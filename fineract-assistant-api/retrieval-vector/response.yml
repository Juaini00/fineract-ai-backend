info:
  name: vector retrieval selects the held-out capability
  type: http
  seq: 4
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{retrievalVectorJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{retrievalVectorToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        // FIN-138 — poll berbasis hitungan (FIN-134) habis dalam ~puluhan ms
        // karena setNextRequest mengulang tanpa jeda `--delay`, jauh lebih
        // cepat daripada panggilan embedding eksternal yang sesungguhnya.
        // lib/poll.js sudah dipakai FIN-141 untuk masalah yang sama: batas
        // WAKTU (90 s) dengan tidur per-poll.
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          const document = res.getBody().data;
          test("FIN-41: vector fallback selects savings_deposit_total", function () {
            expect(res.getStatus()).to.equal(200);
            expect(document.kind).to.equal("analysis");
            expect(document.evidence_json.lineage[0].capability_id)
              .to.equal("savings_deposit_total");
          });
        }
