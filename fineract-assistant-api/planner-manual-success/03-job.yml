info:
  name: manual planner submit
  type: http
  seq: 3
http:
  method: post
  url: '{{baseUrl}}/chat/jobs'
  headers:
  - name: authorization
    value: Bearer {{manualPlannerToken}}
  - name: content-type
    value: application/json
  - name: Idempotency-Key
    value: '{{manualPlannerIdem}}'
  body:
    type: json
    data: '{"session_id":"{{manualPlannerSession}}","request_text":"{{manualPlannerRequest}}"}'
runtime:
  scripts:
  - type: before-request
    code: |
      bru.setVar("manualPlannerIdem", "manual-fin163-" + Date.now() + "-" + Math.random().toString(36).slice(2));
      bru.setVar("jobPollStart_manual_planner_terminal_snapshot", 0);
  - type: tests
    code: 'test("job accepted", () => expect(res.getStatus()).to.equal(202));

      bru.setVar("manualPlannerJob", res.getBody().data.job_id);'
