info:
  name: inspect configured and implemented models
  type: http
  seq: 3
http:
  method: get
  url: "{{baseUrl}}/settings/models"
  headers:
    - name: authorization
      value: "Bearer {{settingsToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        test("Unobserved generation availability is not claimed and no selection fallback exists", function () {
          expect(res.getStatus()).to.equal(200);
          const data = res.getBody().data;
          if (!data.generation.connection_checked) {
            expect(data.generation.operational).to.equal(false);
          }
          expect(data.planning.deterministic_selection_fallback).to.equal(false);
          expect(data.narration.implementation).to.equal("not_integrated");
          expect(data.embedding.dimensions).to.be.a("number");
          expect(JSON.stringify(data)).to.not.match(/api_key|base_url|chat_completions_url|password/i);
        });
