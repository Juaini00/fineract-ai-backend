info:
  name: refresh - token hasil rotasi setelah reuse terdeteksi
  type: http
  seq: 10

http:
  method: post
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: cookie
      value: "refresh_token={{rotatedRefreshToken}}"

runtime:
