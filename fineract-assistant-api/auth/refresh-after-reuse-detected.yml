        test("401: reuse mencabut SELURUH session, bukan hanya token lama", function () {
          // Pengguna sah dan penyerang memegang rantai yang sama dan tidak
          // dapat dibedakan, jadi keduanya kehilangan session.
          expect(res.getStatus()).to.equal(401);
        });
