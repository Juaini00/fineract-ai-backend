info:
  name: login - password salah
  type: http
  seq: 5

http:
  method: post
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |
      {
        "username": "{{username}}",
        "password": "password-yang-salah"
      }

runtime:
  scripts:
    - type: tests
      code: |
        test("401 dengan pesan generik", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error.message).to.equal("Unauthorized");
        });

        // Dibandingkan dengan respons user tak dikenal pada request berikutnya:
        // keduanya wajib identik agar tidak menjadi oracle enumerasi akun.
        bru.setVar("wrongPasswordBody", JSON.stringify(res.getBody()));
