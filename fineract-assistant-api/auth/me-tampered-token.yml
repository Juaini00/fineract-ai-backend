info:
  name: me - token dirusak
  type: http
  seq: 3

http:
  method: get
  url: "{{baseUrl}}/auth/me"
  headers:
    - name: authorization
      value: "Bearer {{accessToken}}tampered"

runtime:
  scripts:
    - type: tests
      code: |
        test("API-6 — bearer yang dirusak ditolak 401 tanpa membocorkan sebabnya", function () {
          // API-6: bearer tidak sah tidak boleh menginspeksi apa pun; pesan generik,
          // tidak mengungkap apakah token kedaluwarsa, salah tanda, atau tak dikenal.
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error.code).to.equal("UNAUTHORIZED");
          expect(res.getBody().error.message).to.equal("Unauthorized");
          expect(res.getBody().data).to.equal(null);
        });
