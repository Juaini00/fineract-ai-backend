info:
  name: job yang setiap attempt-nya ditinggalkan sesudah query
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{exhaustedToken}}"
    - name: Idempotency-Key
      value: "{{exhaustedKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{exhaustedSession}}", "request_text": "Show the savings portfolio summary." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("exhaustedKey", "fin56-exhausted-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("exhaustedJob", res.getBody().data.job_id);
