info:
  name: admin login for reindex
  type: http
  seq: 2
http:
  method: post
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |
      {"username":"{{username}}","password":"{{password}}"}
runtime:
  scripts:
    - type: tests
      code: |
        test("admin token issued", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.user.role).to.equal("admin");
        });
        bru.setVar("reindexAdminToken", res.getBody().data.access_token);
