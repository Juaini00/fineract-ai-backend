info:
  name: duplicate maintenance rejected under database lock
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/settings/catalog/reindex"
  headers:
    - name: authorization
      value: "Bearer {{reindexEdgeToken}}"
    - name: content-type
      value: application/json
  body:
    type: json
    data: |
      {"rebuild_embeddings":false}
runtime:
  scripts:
    - type: tests
      code: |
        test("409 while first run still owns advisory lock", function () {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().error.code).to.equal("CONFLICT");
        });
