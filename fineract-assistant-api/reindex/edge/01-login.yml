info:
  name: admin login for provider edge
  type: http
  seq: 1
http:
  method: post
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |
      {"username":"{{username}}","password":"{{password}}"}
runtime:
  scripts:
    - type: tests
      code: |
        test("admin login", function () { expect(res.getStatus()).to.equal(200); });
        bru.setVar("reindexEdgeToken", res.getBody().data.access_token);
