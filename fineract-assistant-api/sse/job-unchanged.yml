info:
  name: membaca stream tidak mengubah job
  type: http
  seq: 12
  description: |
    sse.md: "Connection loss never cancels a job." Stream adalah proyeksi baca;
    empat kali membukanya tidak boleh memindahkan lifecycle, menambah event,
    atau menggeser cursor.

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{sseJobId}}"
  headers:
    - name: authorization
      value: "Bearer {{sseToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const job = res.getBody().data;

        test("lifecycle dan cursor persis seperti sebelum stream dibuka", function () {
          expect(job.lifecycle).to.equal("Completed");
          expect(job.outcome).to.equal("Answered");
          expect(String(job.last_event_sequence)).to.equal(bru.getVar("sseLastSequence"));
        });

        test("SSE-3 — memutus koneksi bukan cancel: job tetap seperti semula", function () {
          // SSE-3 (paruh disconnect != cancel): stream dibuka lalu ditutup berkali
          // -kali oleh test-test sebelumnya (replay penuh, replay dari cursor,
          // pengiriman ulang). Kalau memutus koneksi diperlakukan sebagai cancel,
          // lifecycle akan bergeser ke Cancelled/Cancelling dan cursor bertambah.
          // Ia tetap Completed/Answered dengan last_event_sequence yang sama —
          // membuktikan membaca/menutup stream adalah proyeksi baca murni.
          expect(job.lifecycle).to.equal("Completed");
          expect(job.lifecycle).to.not.be.oneOf(["Cancelled", "Cancelling"]);
          expect(String(job.last_event_sequence)).to.equal(bru.getVar("sseLastSequence"));
        });
