info:
  name: create job
  type: http
  seq: 3

http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{sseToken}}"
    - name: Idempotency-Key
      value: "{{sseIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{sseSessionId}}",
        "request_text": "Show the savings portfolio summary."
      }

runtime:
  scripts:
    - type: before-request
      code: |
        const unique = String(Date.now()) + Math.random().toString(36).slice(2, 10);
        bru.setVar("sseIdemKey", "bruno-sse-" + unique);
    - type: tests
      code: |
        test("202 dengan cursor awal", function () {
          expect(res.getStatus()).to.equal(202);
          // Acknowledgement membawa cursor: klien berlangganan mulai sesudahnya.
          expect(res.getBody().data.event_cursor).to.equal(1);
        });
        bru.setVar("sseJobId", res.getBody().data.job_id);
