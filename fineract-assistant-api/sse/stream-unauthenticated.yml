info:
  name: stream tanpa bearer
  type: http
  seq: 10
  description: |
    Token tidak pernah boleh dipindahkan ke URL demi kemudahan EventSource
    (sse.md): URL muncul di log proxy, riwayat browser, dan header Referer.

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{sseJobId}}/events"

runtime:
  scripts:
    - type: tests
      code: |
        test("API-6 — tanpa bearer, cursor/stream event tidak dapat diinspeksi: 401", function () {
          // API-6: berlangganan cursor SSE menuntut identitas bearer dari header;
          // tanpa itu tidak ada satu pun event yang bocor.
          expect(res.getStatus()).to.equal(401);
          expect(String(res.getBody())).to.not.match(/^event: /m);
        });
