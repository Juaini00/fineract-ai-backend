info:
  name: slot identitas tanpa resolver tidak dijawab
  type: http
  seq: 22
  description: |
    Sebelum resolver ada, alasannya berbunyi "resolver belum ada" untuk SEMUA
    slot. Sekarang ia menyebut slot mana yang tidak punya resolver, sehingga
    perbedaan antara "belum dibangun" dan "memang tidak ada" terlihat.

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{noResolverJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{resolverToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const document = res.getBody().data;

        test("Unsupported + Unknown, alasan menyebut slotnya", function () {
          expect(res.getStatus()).to.equal(200);
          expect(document.outcome).to.equal("Unsupported");
          expect(document.completeness).to.equal("Unknown");
          expect(document.completeness_reason).to.equal("identity_slot_without_resolver");
        });

        test("tidak ada form: slot ini tidak dapat ditanyakan sama sekali (K1)", function () {
          expect(document.blocks_json[0].body).to.contain("account_number");
          expect(document.blocks_json[0].body).to.contain("never bound from free text");
        });
