info:
  name: job dipersempit ke satu office
  type: http
  seq: 11
  description: |
    Scope resolver berasal dari otorisasi yang dipersempit permintaan (I7),
    bukan dari daftar opsi yang pernah diterbitkan.

http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{resolverToken}}"
    - name: Idempotency-Key
      value: "{{scopedIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{scopedSessionId}}",
        "request_text": "What savings products does this client hold?",
        "office_ids": [1]
      }

runtime:
  scripts:
    - type: before-request
      code: |
        const unique = String(Date.now()) + Math.random().toString(36).slice(2, 10);
        bru.setVar("scopedIdemKey", "bruno-resolver-" + unique);
    - type: tests
      code: |
        test("202", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("scopedJobId", res.getBody().data.job_id);
