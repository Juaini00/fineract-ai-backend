info:
  name: pertanyaan multi-baris dengan cap retensi satu baris
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{cappedToken}}"
    - name: Idempotency-Key
      value: "{{cappedKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{cappedSession}}", "request_text": "Show the savings portfolio summary." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("cappedKey", "dataset-capped-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("cappedJob", res.getBody().data.job_id);
