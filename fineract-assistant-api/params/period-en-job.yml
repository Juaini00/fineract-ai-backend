info:
  name: period-en job
  type: http
  seq: 3

http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{paramsToken}}"
    - name: Idempotency-Key
      value: "{{periodEnIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{periodEnSessionId}}",
        "request_text": "{{periodEnRequestText}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const today = new Date();
        const year = today.getUTCFullYear();
        const month = months[today.getUTCMonth()];
        const isoToday = today.toISOString().slice(0, 10);
        bru.setVar("periodEnIdemKey", "fin135-period-en-" + Date.now());
        bru.setVar("periodEnRequestText", `Total deposits from January to ${month} ${year}.`);
        bru.setVar("periodEnExpectedFrom", `${year}-01-01`);
        bru.setVar("periodEnExpectedTo", isoToday);
    - type: tests
      code: |
        test("202", function () { expect(res.getStatus()).to.equal(202); });
        bru.setVar("periodEnJobId", res.getBody().data.job_id);
