info:
  name: FIN-108 loan_charges answer
  type: http
  seq: 132
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin108loan_chargesJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin108Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          answers.check(test, expect, "loan_charges", document);
          test("FIN-108 loan_charges: verified answer", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-159 LOAN-7: currency_code per row = source loan currency", function () {
            const want = require("./.answers/expected.js").rows.loan_charges;
            const rows = answers.answerRows(document).rows;
            expect(rows.length).to.be.above(0);
            expect(rows.length).to.equal(want.length);
            rows.forEach((r, i) => expect(r.currency_code, "baris " + i).to.equal(want[i].currency_code));
            // >= 2 keeps a hardcoded single currency from passing unnoticed.
            expect(new Set(rows.map((r) => r.currency_code)).size).to.be.at.least(2);
          });
          test("FIN-108 LOAN-7: charged reconciles to paid+waived+written-off+outstanding, each kept distinct", function () {
            const rows = answers.answerRows(document).rows;
            expect(rows.length).to.be.above(0);
            expect(rows.every((r) => Math.abs(Number(r.amount) - (Number(r.amount_paid_derived || 0) + Number(r.amount_waived_derived || 0) + Number(r.amount_writtenoff_derived || 0) + Number(r.amount_outstanding_derived))) < 0.01)).to.equal(true);
          });
        }
