info:
  name: FIN-108 loan_guarantor job
  type: http
  seq: 191
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_guarantorKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_guarantorSession}}", "request_text": "List guarantors for loans in my authorized offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_guarantorKey", "fin108-loan_guarantor-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_guarantorJob", res.getBody().data.job_id);
