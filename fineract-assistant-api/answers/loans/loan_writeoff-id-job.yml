info:
  name: FIN-108 loan_writeoff (ID) job
  type: http
  seq: 236
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_writeoffIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_writeoffIdSession}}", "request_text": "Tampilkan pinjaman yang telah dihapusbukukan (write-off)."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_writeoffIdKey", "fin108-loan_writeoff-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_writeoffIdJob", res.getBody().data.job_id);
