info:
  name: FIN-108 loan_guarantor (ID) job
  type: http
  seq: 196
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_guarantorIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_guarantorIdSession}}", "request_text": "Tampilkan penjamin pinjaman ini."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_guarantorIdKey", "fin108-loan_guarantor-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_guarantorIdJob", res.getBody().data.job_id);
