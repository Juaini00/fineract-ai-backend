info:
  name: FIN-108 loan_disbursement_tranches job
  type: http
  seq: 171
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_disbursement_tranchesKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_disbursement_tranchesSession}}", "request_text": "Show the disbursement tranches for staged loans in my offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_disbursement_tranchesKey", "fin108-loan_disbursement_tranches-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_disbursement_tranchesJob", res.getBody().data.job_id);
