info:
  name: FIN-108 loan_balances job
  type: http
  seq: 141
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_balancesKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_balancesSession}}", "request_text": "Show outstanding loan balances in my authorized offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_balancesKey", "fin108-loan_balances-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_balancesJob", res.getBody().data.job_id);
