info:
  name: FIN-108 loan_capitalized_income_balance (ID) job
  type: http
  seq: 256
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_capitalized_income_balanceIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_capitalized_income_balanceIdSession}}", "request_text": "Tampilkan saldo pendapatan yang dikapitalisasi untuk pinjaman."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_capitalized_income_balanceIdKey", "fin108-loan_capitalized_income_balance-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_capitalized_income_balanceIdJob", res.getBody().data.job_id);
