info:
  name: FIN-108 loans_by_client job
  type: http
  seq: 2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loans_by_clientKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loans_by_clientSession}}", "request_text": "What loans does a client have and what is their status?"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loans_by_clientKey", "fin108-loans_by_client-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loans_by_clientJob", res.getBody().data.job_id);
