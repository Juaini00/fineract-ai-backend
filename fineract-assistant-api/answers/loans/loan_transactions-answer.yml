info:
  name: FIN-108 loan_transactions answer
  type: http
  seq: 122
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin108loan_transactionsJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin108Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          answers.check(test, expect, "loan_transactions", document);
          test("FIN-108 loan_transactions: verified answer", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-108 LOAN-6: allocation reconciles for repayment-type rows", function () {
            const rows = answers.answerRows(document).rows;
            expect(rows.length).to.be.above(0);
            const repayments = rows.filter((r) => r.transaction_type === "repayment");
            expect(repayments.length).to.be.above(0);
            expect(repayments.every((r) => Math.abs(Number(r.amount) - (Number(r.principal_portion_derived) + Number(r.interest_portion_derived) + Number(r.fee_charges_portion_derived) + Number(r.penalty_charges_portion_derived) + Number(r.overpayment_portion_derived))) < 0.01)).to.equal(true);
          });
        }
