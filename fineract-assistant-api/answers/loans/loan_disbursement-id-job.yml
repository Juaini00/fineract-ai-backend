info:
  name: FIN-108 loan_disbursement (ID) job
  type: http
  seq: 166
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_disbursementIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_disbursementIdSession}}", "request_text": "Tampilkan detail pencairan pinjaman ini."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_disbursementIdKey", "fin108-loan_disbursement-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_disbursementIdJob", res.getBody().data.job_id);
