info:
  name: FIN-108 loan_recovery (ID) job
  type: http
  seq: 246
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_recoveryIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_recoveryIdSession}}", "request_text": "Tampilkan pembayaran recovery untuk pinjaman yang dihapusbukukan."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_recoveryIdKey", "fin108-loan_recovery-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_recoveryIdJob", res.getBody().data.job_id);
