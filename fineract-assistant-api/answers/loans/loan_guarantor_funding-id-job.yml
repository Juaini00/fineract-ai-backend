info:
  name: FIN-108 loan_guarantor_funding (ID) job
  type: http
  seq: 206
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_guarantor_fundingIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_guarantor_fundingIdSession}}", "request_text": "Tampilkan dana jaminan penjamin untuk pinjaman ini."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_guarantor_fundingIdKey", "fin108-loan_guarantor_funding-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_guarantor_fundingIdJob", res.getBody().data.job_id);
