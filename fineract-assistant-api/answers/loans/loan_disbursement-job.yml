info:
  name: FIN-108 loan_disbursement job
  type: http
  seq: 161
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_disbursementKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_disbursementSession}}", "request_text": "Show loan disbursement details."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_disbursementKey", "fin108-loan_disbursement-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_disbursementJob", res.getBody().data.job_id);
