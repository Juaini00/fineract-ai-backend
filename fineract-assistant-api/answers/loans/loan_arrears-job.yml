info:
  name: FIN-108 loan_arrears job
  type: http
  seq: 151
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_arrearsKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_arrearsSession}}", "request_text": "Show loans in arrears in my authorized offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_arrearsKey", "fin108-loan_arrears-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_arrearsJob", res.getBody().data.job_id);
