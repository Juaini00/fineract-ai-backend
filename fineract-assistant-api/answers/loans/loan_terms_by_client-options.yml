info:
  name: FIN-108 loan_terms_by_client client options
  type: http
  seq: 24
  description: Client 65 is on the second options page (cursor=25), same as savings_products_by_client.
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin108loan_terms_by_clientJob}}/clarification/options?field_id=client_id&cursor=25"
  headers:
    - name: authorization
      value: "Bearer {{fin108Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const option = res.getBody().data.options.find(function (o) { return String(o.option_id) === "65"; });
          test("FIN-108 loan_terms_by_client: client 65 is an authorized option", function () {
            expect(option).to.not.equal(undefined);
          });
          bru.setVar("fin108loan_terms_by_clientOptionId", option && option.option_id);
        }
