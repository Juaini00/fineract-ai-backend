info:
  name: FIN-108 loan_disbursement_tranches (ID) job
  type: http
  seq: 176
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_disbursement_tranchesIdKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_disbursement_tranchesIdSession}}", "request_text": "Tampilkan tahap pencairan pinjaman bertahap."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_disbursement_tranchesIdKey", "fin108-loan_disbursement_tranches-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_disbursement_tranchesIdJob", res.getBody().data.job_id);
