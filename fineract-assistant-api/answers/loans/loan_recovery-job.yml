info:
  name: FIN-108 loan_recovery job
  type: http
  seq: 241
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_recoveryKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_recoverySession}}", "request_text": "Show loan recovery payments in my offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_recoveryKey", "fin108-loan_recovery-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_recoveryJob", res.getBody().data.job_id);
