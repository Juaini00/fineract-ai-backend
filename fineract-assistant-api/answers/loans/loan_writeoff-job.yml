info:
  name: FIN-108 loan_writeoff job
  type: http
  seq: 231
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_writeoffKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_writeoffSession}}", "request_text": "Show written-off loans in my offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_writeoffKey", "fin108-loan_writeoff-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_writeoffJob", res.getBody().data.job_id);
