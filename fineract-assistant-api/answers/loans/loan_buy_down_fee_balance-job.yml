info:
  name: FIN-108 loan_buy_down_fee_balance job
  type: http
  seq: 261
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin108Token}}"
    - name: Idempotency-Key
      value: "{{fin108loan_buy_down_fee_balanceKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin108loan_buy_down_fee_balanceSession}}", "request_text": "Show buy-down fee balances for loans in my offices."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin108loan_buy_down_fee_balanceKey", "fin108-loan_buy_down_fee_balance-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin108loan_buy_down_fee_balanceJob", res.getBody().data.job_id);
