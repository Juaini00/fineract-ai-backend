info:
  name: FIN-128 client address answer versus independent SQL
  type: http
  seq: 72
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin128_address_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin128Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "client_address", document);
          test("FIN-128 client address: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-128 CLI-6: 1 client address returned with PII sensitivity and no identifiers leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(1);
            for (const forbidden of ["account_no", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
