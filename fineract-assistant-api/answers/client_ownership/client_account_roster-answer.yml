info:
  name: FIN-128 client account roster answer versus independent SQL
  type: http
  seq: 42
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin128_account_roster_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin128Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "client_account_roster", document);
          test("FIN-128 client account roster: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "client_account_roster",
            document,
            200,
            answers.populationSize("client_account_roster")
          );
          test("FIN-128 CLI-5: roster spans loan, savings, and share account types with no identifiers leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            const types = new Set(got.rows.map((r) => r.account_type));
            expect(types.has("loan")).to.equal(true);
            expect(types.has("savings")).to.equal(true);
            expect(types.has("share")).to.equal(true);
            for (const forbidden of ["account_no", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
