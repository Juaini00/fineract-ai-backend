info:
  name: FIN-128 client account roster session
  type: http
  seq: 40
http:
  method: post
  url: "{{baseUrl}}/chat/sessions"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin128Token}}"
  body:
    type: json
    data: |
      { "title": "FIN-128 client account roster" }
runtime:
  scripts:
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(201);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin128_account_roster_session", res.getBody().data.id);
