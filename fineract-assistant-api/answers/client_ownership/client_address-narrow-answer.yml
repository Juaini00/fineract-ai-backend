info:
  name: FIN-128 client address narrow answer versus independent SQL
  type: http
  seq: 82
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin128_address_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin128Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "client_address", document, { truthKey: "client_address__scope_2_3", narrowedTo: 2 });
          test("FIN-128 client address narrow: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-128 CLI-6: narrowing to offices 2 and 3 returns genuine Empty on this fixture", function () {
            expect(document.outcome).to.equal("Empty");
            expect(answers.answerRows(document).rows.length).to.equal(0);
          });
        }
