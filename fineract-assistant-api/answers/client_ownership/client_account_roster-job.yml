info:
  name: FIN-128 client account roster job
  type: http
  seq: 41
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin128Token}}"
    - name: Idempotency-Key
      value: "{{fin128_account_roster_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin128_account_roster_session}}", "request_text": "Show the full client account roster in my authorized offices." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin128_account_roster_key", "fin128-account-roster-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin128_account_roster_job", res.getBody().data.job_id);
