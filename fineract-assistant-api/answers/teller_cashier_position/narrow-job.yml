info:
  name: FIN-115 position narrow job
  type: http
  seq: 21
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin115posToken}}"
    - name: Idempotency-Key
      value: "{{fin115pos_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin115pos_narrow_session}}", "request_text": "What is the recorded cash position of each cashier by currency for April 2026?", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin115pos_narrow_key", "fin115pos-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin115pos_narrow_job", res.getBody().data.job_id);
