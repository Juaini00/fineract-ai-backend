info:
  name: FIN-115 position login
  type: http
  seq: 0
http:
  method: post
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |
      { "username": "{{username}}", "password": "{{password}}" }
runtime:
  scripts:
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(200);
        bru.setVar("fin115posToken", res.getBody().data.access_token);
