info:
  name: FIN-115 position narrow answer
  type: http
  seq: 22
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin115pos_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin115posToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          answers.check(test, expect, "cashier_recorded_cash_position", document, { truthKey: "cashier_recorded_cash_position__scope_2_3", narrowedTo: 2 });
          test("FIN-115 D06: narrowing to offices 2 and 3 keeps only their cashiers' positions", function () {
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            expect(got.rows.every((row) => [2, 3].includes(row.office_id))).to.equal(true);
          });
        }
