info:
  name: FIN-113 allocations answer versus independent SQL
  type: http
  seq: 32
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin113_allocations_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin113Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "client_charge_payment_allocations", document);
          test("FIN-113 allocations: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-113 D04: no recorded payment allocation is an actual Empty answer (zero rows)", function () {
            expect(document.outcome).to.equal("Empty");
            expect(answers.answerRows(document).rows.length).to.equal(0);
          });
        }
