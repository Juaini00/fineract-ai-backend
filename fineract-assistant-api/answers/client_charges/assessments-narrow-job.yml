info:
  name: FIN-113 assessments-narrow job
  type: http
  seq: 21
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin113Token}}"
    - name: Idempotency-Key
      value: "{{fin113_assessments_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin113_assessments_narrow_session}}", "request_text": "Show client charge assessments from January 2026 to March 2026.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin113_assessments_narrow_key", "fin113-assessments-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin113_assessments_narrow_job", res.getBody().data.job_id);
