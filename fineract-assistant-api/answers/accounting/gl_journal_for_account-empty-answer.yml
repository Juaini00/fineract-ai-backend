info:
  name: FIN-112 gl_journal_for_account empty answer
  type: http
  seq: 10
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin112_journal_account_empty_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin112Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          test("FIN-112 gl_journal_for_account empty: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-112 D12: office 9 has zero journal entries returning genuine Empty outcome", function () {
            expect(document.outcome).to.equal("Empty");
            expect(answers.answerRows(document).rows.length).to.equal(0);
          });
        }
