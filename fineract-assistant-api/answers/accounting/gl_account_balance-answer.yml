info:
  name: FIN-112 gl_account_balance answer versus independent SQL
  type: http
  seq: 19
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin112_account_balance_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin112Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "gl_account_balance", document);
          test("FIN-112 gl_account_balance: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-112 D12: balance per office and currency without cross-currency consolidation", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(23);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
