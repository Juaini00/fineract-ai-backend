info:
  name: FIN-112 gl_journal_for_transaction job
  type: http
  seq: 12
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin112Token}}"
    - name: Idempotency-Key
      value: "{{fin112_journal_tx_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin112_journal_tx_session}}", "request_text": "List general ledger journal entries produced by a business transaction." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin112_journal_tx_key", "fin112-jtx-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin112_journal_tx_job", res.getBody().data.job_id);
