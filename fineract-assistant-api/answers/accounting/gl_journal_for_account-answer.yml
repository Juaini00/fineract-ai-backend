info:
  name: FIN-112 gl_journal_for_account answer versus independent SQL
  type: http
  seq: 4
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin112_journal_account_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin112Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "gl_journal_for_account", document);
          test("FIN-112 gl_journal_for_account: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "gl_journal_for_account",
            document,
            200,
            answers.populationSize("gl_journal_for_account")
          );
          test("FIN-112 D12: positive non-zero journal entries and no identifiers leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
