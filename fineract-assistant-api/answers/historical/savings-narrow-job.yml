info:
  name: FIN-121 savings narrow job
  type: http
  seq: 41
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin121Token}}"
    - name: Idempotency-Key
      value: "{{fin121_savings_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin121_savings_narrow_session}}", "request_text": "Saldo tabungan per 2026-04-30.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin121_savings_narrow_key", "fin121-savings-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin121_savings_narrow_job", res.getBody().data.job_id);
