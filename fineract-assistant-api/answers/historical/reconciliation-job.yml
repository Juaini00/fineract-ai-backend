info:
  name: FIN-121 reconciliation job
  type: http
  seq: 51
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin121Token}}"
    - name: Idempotency-Key
      value: "{{fin121_recon_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin121_recon_session}}", "request_text": "Show loan position as of today." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin121_recon_key", "fin121-recon-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin121_recon_job", res.getBody().data.job_id);
