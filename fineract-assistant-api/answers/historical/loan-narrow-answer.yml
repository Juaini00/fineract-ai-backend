info:
  name: FIN-121 loan narrow answer versus independent SQL
  type: http
  seq: 22
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin121_loan_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin121Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "loan_position_asof", document, {
            truthKey: "loan_position_asof__scope_2_3",
            narrowedTo: 2,
          });
          test("FIN-121 loan narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-121 D01: narrowed offices 2 and 3 returns Answered Complete", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
          });
        }
