info:
  name: FIN-121 published report refusal job
  type: http
  seq: 61
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin121Token}}"
    - name: Idempotency-Key
      value: "{{fin121_refusal_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin121_refusal_session}}", "request_text": "Reproduce the published report for last month." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin121_refusal_key", "fin121-refusal-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin121_refusal_job", res.getBody().data.job_id);
