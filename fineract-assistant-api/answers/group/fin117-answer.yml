info:
  name: FIN-117 group schedule answer versus independent SQL
  type: http
  seq: 3
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin117AnswerJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin117AnswerToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          answers.check(test, expect, "group_center_meeting_schedule", document);
          test("FIN-117 D08: independent answer has complete scheduled-only evidence", function () {
            expect(document.completeness).to.equal("Complete");
            expect(document.validation_status).to.equal("passed");
            expect(document.blocks_json.some((block) => block.type === "table")).to.equal(true);
          });
        }
