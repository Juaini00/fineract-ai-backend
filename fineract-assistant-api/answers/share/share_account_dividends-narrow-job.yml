info:
  name: FIN-111 share account dividends narrow job
  type: http
  seq: 54
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin111Token}}"
    - name: Idempotency-Key
      value: "{{fin111_share_divs_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin111_share_divs_narrow_session}}", "request_text": "Show share account dividends in my authorized offices.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin111_share_divs_narrow_key", "fin111-share-divs-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin111_share_divs_narrow_job", res.getBody().data.job_id);
