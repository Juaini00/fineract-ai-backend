info:
  name: FIN-111 share accounts empty job
  type: http
  seq: 17
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin111Token}}"
    - name: Idempotency-Key
      value: "{{fin111_share_accounts_empty_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin111_share_accounts_empty_session}}", "request_text": "Show share accounts from November 2025 to April 2026.", "office_ids": [2] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin111_share_accounts_empty_key", "fin111-share-accounts-empty-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin111_share_accounts_empty_job", res.getBody().data.job_id);
