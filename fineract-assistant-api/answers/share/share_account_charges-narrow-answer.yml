info:
  name: FIN-111 share account charges narrow answer versus independent SQL
  type: http
  seq: 35
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin111_share_charges_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin111Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "share_account_charges", document, { truthKey: "share_account_charges__scope_2_3", narrowedTo: 2 });
          test("FIN-111 share account charges narrow: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-111 SHARE-3: narrowing to offices 2 and 3 returns actual Empty on this fixture", function () {
            expect(document.outcome).to.equal("Empty");
            expect(answers.answerRows(document).rows.length).to.equal(0);
          });
        }
