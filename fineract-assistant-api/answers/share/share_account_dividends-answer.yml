info:
  name: FIN-111 share account dividends answer versus independent SQL
  type: http
  seq: 52
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin111_share_divs_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin111Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "share_account_dividends", document);
          test("FIN-111 share account dividends: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-111 SHARE-4: no recorded share account dividends is an actual Empty answer (zero rows)", function () {
            expect(document.outcome).to.equal("Empty");
            expect(answers.answerRows(document).rows.length).to.equal(0);
          });
        }
