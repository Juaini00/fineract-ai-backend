info:
  name: FIN-116 entries-narrow job
  type: http
  seq: 31
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin116Token}}"
    - name: Idempotency-Key
      value: "{{fin116_entries_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin116_entries_narrow_session}}", "request_text": "Show recorded provisioning entries.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin116_entries_narrow_key", "fin116-entries-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin116_entries_narrow_job", res.getBody().data.job_id);
