info:
  name: FIN-127 savings_transactions_by_type job
  type: http
  seq: 16.2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{fin127_tx_by_type_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin127_tx_by_type_session}}", "request_text": "Show savings transactions breakdown by type from November 2025 to April 2026." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin127_tx_by_type_key", "fin127-tx-by-type-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin127_tx_by_type_job", res.getBody().data.job_id);
