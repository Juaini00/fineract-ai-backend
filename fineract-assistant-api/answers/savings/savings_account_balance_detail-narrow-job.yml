info:
  name: FIN-127 savings_account_balance_detail narrow job
  type: http
  seq: 15.5
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{fin127_balance_detail_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin127_balance_detail_narrow_session}}", "request_text": "Show savings account balance detail with available and on-hold funds from November 2025 to April 2026.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin127_balance_detail_narrow_key", "fin127-balance-detail-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin127_balance_detail_narrow_job", res.getBody().data.job_id);
