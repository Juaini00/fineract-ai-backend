info:
  name: FIN-127 savings_linked_accounts job
  type: http
  seq: 14.2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{fin127_linked_accounts_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin127_linked_accounts_session}}", "request_text": "Show linked savings accounts and portfolio associations." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin127_linked_accounts_key", "fin127-linked-accounts-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin127_linked_accounts_job", res.getBody().data.job_id);
