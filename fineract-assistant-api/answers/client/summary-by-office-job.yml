info:
  name: client_summary_by_office job
  type: http
  seq: 11.2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{answersKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{answersSession}}", "request_text": "Show client breakdown per office." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("answersKey", "fin52-client_summary_by_office-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("answersJob", res.getBody().data.job_id);
