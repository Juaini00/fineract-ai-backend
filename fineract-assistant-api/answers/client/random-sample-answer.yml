info:
  name: client_random_sample answer
  type: http
  seq: 8.3
  description: |
    client_random_sample.sql adalah populasi PENUH nasabah aktif yang sah
    (limit/office_name tidak terikat dari teks bebas, jadi tidak menyempit).
    38 = jumlah nasabah aktif dalam scope kantor terotorisasi saat ini
    (< hard_cap 50, jadi LIMIT tidak pernah memotong); checkSubset menguji
    setiap baris jawaban ada di populasi, tanpa duplikat, dan jumlahnya
    persis 38 — urutannya sengaja acak sehingga tidak diadu posisi.
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{answersJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{answersToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (answers.awaitResponse(bru, res, "client_random_sample answer")) {
          answers.checkSubset(test, expect, "client_random_sample", res.getBody().data, 38);
        }
