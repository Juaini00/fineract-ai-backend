info:
  name: client_activation_top_n_offices job
  type: http
  seq: 13.2
  description: |
    Bulan berjalan tidak punya aktivasi nasabah baru pada seed lokal ini —
    dibuktikan lewat outcome Empty (0 baris), bukan dipaksa ke rentang lain.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{answersKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{answersSession}}", "request_text": "Top offices by new client activations this month." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("answersKey", "fin52-client_activation_top_n_offices-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("answersJob", res.getBody().data.job_id);
