info:
  name: savings_charges_by_type form klarifikasi
  type: http
  seq: 5.3
  description: |
    FIN-137 — charge_name sekarang identity slot beresolver (K1): wired to
    savings_charge_type_identity_resolve, ditanyakan sebagai single_choice
    (dulu text bebas).
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{chargesByTypeJob}}/clarification"
  headers:
    - name: authorization
      value: "Bearer {{answersToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const form = res.getBody().data;
          test("FIN-137: form klarifikasi terbuka untuk slot charge_name (resolver, bukan lagi teks bebas)", function () {
            expect(res.getStatus()).to.equal(200);
            expect(form.state).to.equal("open");
            expect(form.fields_json[0].field_id).to.equal("charge_name");
            expect(form.fields_json[0].type).to.equal("single_choice");
          });
          bru.setVar("chargesByTypeClarificationId", form.clarification_id);
          bru.setVar("chargesByTypeRevision", form.revision);
        }
