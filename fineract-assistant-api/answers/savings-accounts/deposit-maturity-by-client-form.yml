info:
  name: savings_deposit_maturity_by_client form klarifikasi
  type: http
  seq: 10.3
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{depositMaturityJob}}/clarification"
  headers:
    - name: authorization
      value: "Bearer {{answersToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const form = res.getBody().data;
          test("form klarifikasi terbuka untuk slot client_id", function () {
            expect(res.getStatus()).to.equal(200);
            expect(form.state).to.equal("open");
            expect(form.fields_json[0].field_id).to.equal("client_id");
            expect(form.fields_json[0].type).to.equal("single_choice");
          });
          bru.setVar("depositMaturityClarificationId", form.clarification_id);
          bru.setVar("depositMaturityRevision", form.revision);
        }
