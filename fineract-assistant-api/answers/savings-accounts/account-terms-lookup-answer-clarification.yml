info:
  name: savings_account_terms_lookup jawab klarifikasi
  type: http
  seq: 2.5
http:
  method: post
  url: "{{baseUrl}}/chat/jobs/{{acctTermsJob}}/responses"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{acctTermsKey}}-answer"
  body:
    type: json
    data: |
      {
        "clarification_id": "{{acctTermsClarificationId}}",
        "revision": {{acctTermsRevision}},
        "answers": { "savings_account_id": "{{acctTermsOptionId}}" }
      }
runtime:
  scripts:
    - type: tests
      code: |
        test("jawaban klarifikasi durable, job yang sama kembali mengantre", function () {
          expect(res.getStatus()).to.equal(202);
          expect(res.getBody().data.job_id).to.equal(bru.getVar("acctTermsJob"));
          expect(res.getBody().data.lifecycle).to.equal("Queued");
        });
