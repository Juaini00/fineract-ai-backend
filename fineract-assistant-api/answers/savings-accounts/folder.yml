  description: |
    FIN-52 (L4.0). Skipped: `savings_charge_type_identity_resolve`
    (knowledge/capabilities/savings/charge_type_identity_resolve.yaml).
    `kind: probe`, `continuation: true` (lines 12-13); the file comment
    (lines 5-11) says the workflow compiler resolves a named charge type
    through this probe before running a charge_name-scoped capability, but
    no such wiring exists: `savings_charge_count_by_type` and
    `savings_charges_by_type` both bind `charge_name` as a plain string
    straight into SQL (`lower(ch.name) = lower($2::text)` — see
    queries/savings/charge_count_by_type.sql line 9 and
    queries/savings/charges_by_type.sql line 37), never through
    `charge_definition_id`/this probe. No other capability manifest under
    knowledge/capabilities references `savings.charge_definitions` or
    `charge_type_candidates` as a `parameters.*.probe` slot (grepped the
    whole `knowledge/capabilities` tree). It is therefore never reachable
    through `POST /chat/jobs`, first-turn or continuation — only ever
    exercised via direct PREPARE/EXECUTE in
    knowledge/VERIFICATION.md §"savings_charge_type_identity_resolve —
    lulus" (L1, not L4). No `tests/answers/savings_charge_type_identity_resolve.sql`
    and no Bruno chain in this folder for it.
