info:
  name: savings_deposit_maturity_by_client job
  type: http
  seq: 10.2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{depositMaturityKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{depositMaturitySession}}", "request_text": "Show the recurring deposit schedule for a client." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("depositMaturityKey", "fin52-savings_deposit_maturity_by_client-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("depositMaturityJob", res.getBody().data.job_id);
