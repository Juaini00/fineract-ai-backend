info:
  name: savings_client_activity jawab klarifikasi
  type: http
  seq: 9.5
http:
  method: post
  url: "{{baseUrl}}/chat/jobs/{{clientActivityJob}}/responses"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{answersToken}}"
    - name: Idempotency-Key
      value: "{{clientActivityKey}}-answer"
  body:
    type: json
    data: |
      {
        "clarification_id": "{{clientActivityClarificationId}}",
        "revision": {{clientActivityRevision}},
        "answers": { "client_id": "{{clientActivityOptionId}}" }
      }
runtime:
  scripts:
    - type: tests
      code: |
        test("jawaban klarifikasi durable, job yang sama kembali mengantre", function () {
          expect(res.getStatus()).to.equal(202);
          expect(res.getBody().data.job_id).to.equal(bru.getVar("clientActivityJob"));
          expect(res.getBody().data.lifecycle).to.equal("Queued");
        });
