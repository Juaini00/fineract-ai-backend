info:
  name: FIN-120 detail answer versus independent SQL
  type: http
  seq: 32
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin120_detail_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin120Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "loan_outstanding_unclassified_detail", document);
          test("FIN-120 detail: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-120 D11: unclassified detail positive rows and surrogate ids only", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            for (const forbidden of ["account_no", "external_id", "client_name", "display_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
