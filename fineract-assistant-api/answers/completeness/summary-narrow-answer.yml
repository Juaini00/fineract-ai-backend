info:
  name: FIN-120 summary-narrow answer versus independent SQL
  type: http
  seq: 22
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin120_summary_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin120Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "loan_outstanding_by_classification", document, {
            truthKey: "loan_outstanding_by_classification__scope_2_3",
            narrowedTo: 2,
          });
          test("FIN-120 summary-narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-120 D11: narrowed offices 2 and 3 yield both Standard and Sektor belum tercatat", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            const classifications = got.rows.map((r) => r.classification);
            expect(classifications).to.include("Sektor belum tercatat");
            expect(classifications).to.include("Standard ");
          });
        }
