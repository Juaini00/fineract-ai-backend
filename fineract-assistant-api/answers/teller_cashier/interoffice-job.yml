info:
  name: FIN-115 interoffice job
  type: http
  seq: 91
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin115Token}}"
    - name: Idempotency-Key
      value: "{{fin115_interoffice_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin115_interoffice_session}}", "request_text": "List the recorded cash transfers between my offices from January 2026 to June 2026." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin115_interoffice_key", "fin115-interoffice-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin115_interoffice_job", res.getBody().data.job_id);
