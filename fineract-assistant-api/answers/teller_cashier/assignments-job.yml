info:
  name: FIN-115 assignments job
  type: http
  seq: 11
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin115Token}}"
    - name: Idempotency-Key
      value: "{{fin115_assignments_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin115_assignments_session}}", "request_text": "Show the teller and cashier assignments that overlap February 2026." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin115_assignments_key", "fin115-assignments-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin115_assignments_job", res.getBody().data.job_id);
