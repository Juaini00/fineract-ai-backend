info:
  name: FIN-115 movements-narrow answer versus independent SQL
  type: http
  seq: 42
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin115_movements_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin115Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          answers.check(test, expect, "cashier_cash_movements", document, { truthKey: "cashier_cash_movements__scope_2_3", narrowedTo: 2 });
          test("FIN-115 movements-narrow: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-115 D06: narrowing to offices 2 and 3 drops every other office's movements", function () {
            const got = answers.answerRows(document);
            expect(got.rows.every((row) => [2, 3].includes(row.office_id))).to.equal(true);
          });
        }
