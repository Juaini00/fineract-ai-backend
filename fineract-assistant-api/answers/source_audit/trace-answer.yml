info:
  name: FIN-118 trace answer versus independent SQL
  type: http
  seq: 32
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin118_trace_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin118Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "command_source_trace", document);
          test("FIN-118 trace: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "command_source_trace",
            document,
            200,
            answers.populationSize("command_source_trace")
          );
          test("FIN-118 D09: exactly 16 actions traced for savings account 37", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(16);
            for (const r of got.rows) {
              expect(r.savings_account_id).to.equal(37);
            }
            for (const forbidden of ["command_as_json", "result", "client_ip", "api_get_url", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
