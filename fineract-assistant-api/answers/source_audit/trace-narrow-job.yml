info:
  name: FIN-118 trace-narrow job
  type: http
  seq: 41
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin118Token}}"
    - name: Idempotency-Key
      value: "{{fin118_trace_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin118_trace_narrow_session}}", "request_text": "Show command source trace for savings account 37.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin118_trace_narrow_key", "fin118-trace-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin118_trace_narrow_job", res.getBody().data.job_id);
