info:
  name: FIN-118 actions-narrow answer versus independent SQL
  type: http
  seq: 22
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin118_actions_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin118Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "command_source_actions", document, {
            truthKey: "command_source_actions__scope_2_3",
            narrowedTo: 2,
          });
          test("FIN-118 actions-narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          test("FIN-118 D09: positive recorded actions in offices 2 and 3 and no payload columns leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            for (const forbidden of ["command_as_json", "result", "client_ip", "api_get_url", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
