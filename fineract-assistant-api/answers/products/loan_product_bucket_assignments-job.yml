info:
  name: FIN-109 loan_product_bucket_assignments job
  type: http
  seq: 23
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin109Token}}"
    - name: Idempotency-Key
      value: "{{fin109loanproductbucketassignmentsKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin109loanproductbucketassignmentsSession}}", "request_text": "Which loan products are configured to use each delinquency bucket?"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin109loanproductbucketassignmentsKey", "fin109-loan_product_bucket_assignments-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin109loanproductbucketassignmentsJob", res.getBody().data.job_id);
