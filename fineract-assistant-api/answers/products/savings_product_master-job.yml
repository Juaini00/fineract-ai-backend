info:
  name: FIN-109 savings_product_master job
  type: http
  seq: 5
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin109Token}}"
    - name: Idempotency-Key
      value: "{{fin109savingsproductmasterKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin109savingsproductmasterSession}}", "request_text": "List all savings product masters including unused deposit products."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin109savingsproductmasterKey", "fin109-savings_product_master-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin109savingsproductmasterJob", res.getBody().data.job_id);
