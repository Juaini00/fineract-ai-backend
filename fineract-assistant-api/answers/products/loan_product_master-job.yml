info:
  name: FIN-109 loan_product_master job
  type: http
  seq: 2
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin109Token}}"
    - name: Idempotency-Key
      value: "{{fin109loanproductmasterKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin109loanproductmasterSession}}", "request_text": "List all loan product masters including unused loan products."}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin109loanproductmasterKey", "fin109-loan_product_master-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin109loanproductmasterJob", res.getBody().data.job_id);
