info:
  name: FIN-114 standing_instruction_executions answer versus independent SQL
  type: http
  seq: 19
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin114_executions_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin114Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "standing_instruction_executions", document);
          test("FIN-114 standing_instruction_executions: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "standing_instruction_executions",
            document,
            200,
            answers.populationSize("standing_instruction_executions")
          );
          test("FIN-114 D05: execution attempts capped at 200 rows from 1,219 total", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(200);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
