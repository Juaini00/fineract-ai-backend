    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "standing_instruction_executions", document, { truthKey: "standing_instruction_executions__scope_2_3", narrowedTo: 2 });
          test("FIN-114 standing_instruction_executions narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "standing_instruction_executions",
            document,
            200,
            265
          );
          test("FIN-114 D05 narrow: positive execution attempts capped at 200 rows under scope 2,3", function () {
            expect(document.outcome).to.equal("Answered");
            expect(answers.answerRows(document).rows.length).to.equal(200);
          });
        }
