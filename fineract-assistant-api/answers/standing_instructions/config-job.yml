info:
  name: FIN-114 standing_instruction_config job
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin114Token}}"
    - name: Idempotency-Key
      value: "{{fin114_config_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin114_config_session}}", "request_text": "Show standing instruction configuration and status." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin114_config_key", "fin114-cfg-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin114_config_job", res.getBody().data.job_id);
