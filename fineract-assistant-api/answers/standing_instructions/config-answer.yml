info:
  name: FIN-114 standing_instruction_config answer versus independent SQL
  type: http
  seq: 4
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin114_config_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin114Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "standing_instruction_config", document);
          test("FIN-114 standing_instruction_config: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-114 D05: instruction configuration and status across authorized scope", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(61);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
