info:
  name: FIN-114 standing_instruction_failures narrow answer versus independent SQL
  type: http
  seq: 28
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin114_failures_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin114Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "standing_instruction_failures", document, { truthKey: "standing_instruction_failures__scope_2_3", narrowedTo: 2 });
          test("FIN-114 standing_instruction_failures narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-114 D05 narrow: positive failed attempts (86 rows) under scope 2,3", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(86);
            for (const row of got.rows) {
              expect(row.status).to.equal("failed");
            }
          });
        }
