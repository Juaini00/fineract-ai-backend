info:
  name: FIN-124 refusal-office job
  type: http
  seq: 37
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin124Token}}"
    - name: Idempotency-Key
      value: "{{fin124OfficeKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin124RefuseSession}}", "request_text": "Which scheduled batch jobs failed from April 2026 to May 2026 in the Branch 001 office?"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin124OfficeKey", "fin124-refusal-office-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin124OfficeJob", res.getBody().data.job_id);
