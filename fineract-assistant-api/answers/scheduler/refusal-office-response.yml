info:
  name: FIN-124 refusal-office response
  type: http
  seq: 37.1
  description: |
    No office filter is invented for scheduler data (owner decision, D14). With a
    real model the request either reaches the planner guard (reason
    `operational_office_unavailable`) or the model declines it (`planner_no_fit` /
    `planner_abstained`); in every case the answer carries no scheduler rows.
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin124OfficeJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin124Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          const document = res.getBody().data;
          test("FIN-124 office-specific scheduler question: no rows, no invented office filter", function () {
            expect(document.kind).to.not.equal("analysis");
            expect(document.completeness).to.equal("Unknown");
            expect(["operational_office_unavailable", "planner_no_fit", "planner_abstained"]).to.include(document.completeness_reason);
            expect(document.blocks_json.some((b) => b.type === "table" || b.type === "metric")).to.equal(false);
            expect(document.evidence_json.lineage || []).to.deep.equal([]);
          });
        }
