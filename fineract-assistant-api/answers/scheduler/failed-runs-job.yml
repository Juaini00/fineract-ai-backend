info:
  name: FIN-124 recovery-failed-runs job
  type: http
  seq: 26
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin124Token}}"
    - name: Idempotency-Key
      value: "{{fin124FailedFailedKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin124FailedFailedSession}}", "request_text": "Which scheduled batch jobs failed from April 2026 to May 2026 on the stored clock?"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin124FailedFailedKey", "fin124-failed-runs-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin124FailedFailedJob", res.getBody().data.job_id);
