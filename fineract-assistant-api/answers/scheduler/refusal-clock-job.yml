info:
  name: FIN-124 refusal-clock job
  type: http
  seq: 38
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin124Token}}"
    - name: Idempotency-Key
      value: "{{fin124ClockKey}}"
  body:
    type: json
    data: |
      {"session_id": "{{fin124RefuseSession}}", "request_text": "Which scheduled batch jobs failed last night on the stored clock?"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin124ClockKey", "fin124-refusal-clock-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("fin124ClockJob", res.getBody().data.job_id);
