info:
  name: FIN-110 terms narrow job
  type: http
  seq: 24
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin110Token}}"
    - name: Idempotency-Key
      value: "{{fin110_terms_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin110_terms_narrow_session}}", "request_text": "Show fixed and recurring deposit terms from April 2026 to June 2026.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin110_terms_narrow_key", "fin110-terms-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin110_terms_narrow_job", res.getBody().data.job_id);
