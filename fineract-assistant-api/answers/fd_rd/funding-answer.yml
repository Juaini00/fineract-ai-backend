info:
  name: FIN-110 funding answer versus independent SQL
  type: http
  seq: 32
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin110_funding_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin110Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "fd_rd_funding", document);
          test("FIN-110 funding: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-110 FDRD-3: funding deposit transactions present without account numbers", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(13);
            for (const forbidden of ["account_no", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
