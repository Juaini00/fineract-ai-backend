info:
  name: FIN-110 shortfall job
  type: http
  seq: 51
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin110Token}}"
    - name: Idempotency-Key
      value: "{{fin110_shortfall_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin110_shortfall_session}}", "request_text": "Show recurring deposit shortfall from January 2026 to March 2026." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin110_shortfall_key", "fin110-shortfall-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin110_shortfall_job", res.getBody().data.job_id);
