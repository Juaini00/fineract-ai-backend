info:
  name: FIN-110 accounts narrow answer versus independent SQL
  type: http
  seq: 15
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin110_accounts_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin110Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "fd_rd_accounts", document, { truthKey: "fd_rd_accounts__scope_2_3", narrowedTo: 2 });
          test("FIN-110 accounts narrow: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-110 accounts narrow: row count matches scope 2,3", function () {
            expect(document.outcome).to.equal("Answered");
            expect(answers.answerRows(document).rows.length).to.equal(5);
          });
        }
