info:
  name: FIN-110 contributions answer versus independent SQL
  type: http
  seq: 42
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin110_contributions_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin110Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "rd_contributions", document);
          test("FIN-110 contributions: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-110 FDRD-8: recurring deposit expected vs actual contributions present", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(16);
            expect(got.columns).to.include("expected_deposit_amount");
            expect(got.columns).to.include("actual_deposit_amount");
            expect(got.columns).to.include("is_calendar_inherited");
            for (const forbidden of ["account_no", "external_id"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
