info:
  name: FIN-130 account_association_links job
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_association_links_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_association_links_session}}", "request_text": "Show account association links and portfolio associations." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_association_links_key", "fin130-assoc-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_association_links_job", res.getBody().data.job_id);
