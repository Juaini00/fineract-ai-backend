http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin130_transaction_reversals_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin130Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "transaction_reversals", document, { truthKey: "transaction_reversals__scope_2_3", narrowedTo: 2 });
          test("FIN-130 transaction_reversals narrow: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "transaction_reversals",
            document,
            200,
            answers.populationSize("transaction_reversals")
          );
          test("FIN-130 LINK-7 narrow: row cap 200 hit with thousands in scope 2,3", function () {
            expect(document.outcome).to.equal("Answered");
            expect(answers.answerRows(document).rows.length).to.equal(200);
          });
        }
