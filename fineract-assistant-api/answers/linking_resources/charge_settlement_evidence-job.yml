info:
  name: FIN-130 charge_settlement_evidence job
  type: http
  seq: 24
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_settlement_evidence_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_settlement_evidence_session}}", "request_text": "Show charge settlement evidence linking charges to transactions." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_settlement_evidence_key", "fin130-settle-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_settlement_evidence_job", res.getBody().data.job_id);
