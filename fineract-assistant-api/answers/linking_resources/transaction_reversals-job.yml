info:
  name: FIN-130 transaction_reversals job
  type: http
  seq: 33
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_transaction_reversals_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_transaction_reversals_session}}", "request_text": "Show transaction reversals in my authorized offices." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_transaction_reversals_key", "fin130-rev-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_transaction_reversals_job", res.getBody().data.job_id);
