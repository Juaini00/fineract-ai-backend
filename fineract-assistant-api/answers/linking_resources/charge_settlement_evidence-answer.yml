info:
  name: FIN-130 charge_settlement_evidence answer versus independent SQL
  type: http
  seq: 25
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin130_settlement_evidence_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin130Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "charge_settlement_evidence", document);
          test("FIN-130 charge_settlement_evidence: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-130 LINK-6: positive non-zero charge settlements and no identifiers leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.equal(165);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
