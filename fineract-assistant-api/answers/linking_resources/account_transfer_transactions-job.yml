info:
  name: FIN-130 account_transfer_transactions job
  type: http
  seq: 9
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_transfer_transactions_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_transfer_transactions_session}}", "request_text": "Show account transfer transactions between accounts." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_transfer_transactions_key", "fin130-transfer-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_transfer_transactions_job", res.getBody().data.job_id);
