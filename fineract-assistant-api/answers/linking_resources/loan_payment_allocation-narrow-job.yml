info:
  name: FIN-130 loan_payment_allocation narrow job
  type: http
  seq: 21
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_payment_allocation_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_payment_allocation_narrow_session}}", "request_text": "Show loan payment allocation breakdown by portion.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_payment_allocation_narrow_key", "fin130-alloc-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_payment_allocation_narrow_job", res.getBody().data.job_id);
