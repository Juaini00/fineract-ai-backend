info:
  name: FIN-130 account_transfer_transactions answer versus independent SQL
  type: http
  seq: 10
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin130_transfer_transactions_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin130Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "account_transfer_transactions", document);
          test("FIN-130 account_transfer_transactions: validated and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
          });
          answers.expectRowCap(
            test,
            expect,
            "account_transfer_transactions",
            document,
            200,
            answers.populationSize("account_transfer_transactions")
          );
          test("FIN-130 LINK-4: positive non-zero transfers and no identifiers leaked", function () {
            expect(document.outcome).to.equal("Answered");
            const got = answers.answerRows(document);
            expect(got.rows.length).to.be.above(0);
            for (const forbidden of ["account_no", "external_id", "client_name"]) {
              expect(got.columns).to.not.include(forbidden);
            }
          });
        }
