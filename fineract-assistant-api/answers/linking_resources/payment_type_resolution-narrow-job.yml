info:
  name: FIN-130 payment_type_resolution narrow job
  type: http
  seq: 42
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin130Token}}"
    - name: Idempotency-Key
      value: "{{fin130_payment_type_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin130_payment_type_narrow_session}}", "request_text": "Show transaction payment types and cash flags.", "office_ids": [2, 3] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin130_payment_type_narrow_key", "fin130-pt-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin130_payment_type_narrow_job", res.getBody().data.job_id);
