info:
  name: FIN-130 charge_settlement_evidence narrow answer versus independent SQL
  type: http
  seq: 28
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{fin130_settlement_evidence_narrow_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{fin130Token}}"
runtime:
  scripts:
    - type: tests
      code: |
        const answers = require("./lib/answers.js");
        if (await answers.awaitResponse(bru, req, res)) {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().success).to.equal(true);
          const document = res.getBody().data;
          answers.check(test, expect, "charge_settlement_evidence", document, { truthKey: "charge_settlement_evidence__scope_2_3", narrowedTo: 2 });
          test("FIN-130 charge_settlement_evidence narrow: validated, complete and not a clarification", function () {
            expect(document.validation_status).to.equal("passed");
            expect(document.completeness).to.equal("Complete");
          });
          test("FIN-130 LINK-6 narrow: row count matches scope 2,3", function () {
            expect(document.outcome).to.equal("Answered");
            expect(answers.answerRows(document).rows.length).to.equal(78);
          });
        }
