info:
  name: FIN-123 currency job
  type: http
  seq: 11
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin123Token}}"
    - name: Idempotency-Key
      value: "{{fin123_currency_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin123_currency_session}}", "request_text": "Show balances per currency in my authorized offices." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin123_currency_key", "fin123-curr-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin123_currency_job", res.getBody().data.job_id);
