info:
  name: FIN-123 currency consolidation refusal job
  type: http
  seq: 31
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{fin123Token}}"
    - name: Idempotency-Key
      value: "{{fin123_refusal_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{fin123_refusal_session}}", "request_text": "Show the consolidated total across currencies for this branch." }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin123_refusal_key", "fin123-refusal-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        expect(res.getBody().success).to.equal(true);
        bru.setVar("fin123_refusal_job", res.getBody().data.job_id);
