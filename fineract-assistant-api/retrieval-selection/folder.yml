info:
  name: retrieval-selection
  seq: 12
  description: |
    FIN-136 — mekanisme pemilihan capability lexical-first (planner::best_capability)
    dibuktikan lewat permukaan HTTP nyata, bukan cuma test unit SQL lokal. Empat
    kasus: satu paraphrase yang dulu salah rute (bukan literal example manifest),
    satu literal example bahasa Inggris yang bertetangga dekat dengan capability
    lain (breakdown vs top-n), satu literal example yang dulu kalah dari
    capability lain karena pengulangan kosakata generik (lifecycle vs
    summary-by-office), dan satu contoh bahasa Indonesia sebagai bukti fix tidak
    meregresi jalur non-Inggris. Dijalankan dengan worker menyala (klaster
    `engine`/`clarification`/`resolver`/`sse`) supaya job benar-benar settle dan
    lineage.capability_id dapat dibaca dari response.

    FIN-142 — literal example manifest `savings_withdrawal_monthly_breakdown`
    ("Show savings withdrawals per month for this year.") masih kalah tipis dari
    `savings_withdrawal_monthly_top_n` setelah fix FIN-136, karena example
    tetangganya near-duplicate. Dua kasus tambahan: literal example
    bahasa Inggris, dan contoh bahasa Indonesia yang sudah ada di manifest
    (`Penarikan tabungan per bulan dari Januari sampai September.`) sebagai
    bukti jalur non-Inggris tidak meregresi.

    FIN-148 — frasa peringkat singkat bahasa Indonesia ("Peringkat penarikan
    tabungan terbesar tiap bulan.") kalah dari `savings_withdrawal_total`
    karena kata "peringkat" tidak pernah muncul di contoh Indonesia manapun
    pada manifest `savings_withdrawal_monthly_top_n` — celah kosakata katalog,
    bukan kelemahan skorer. Dibuktikan dengan menambah contoh
    `Peringkat bulanan.` pada manifest (satu kasus, dipilih setelah beberapa
    kandidat frasa lain terbukti menggeser tie leksikal pre-existing dengan
    capability tetangga — lihat crates/app/fixtures/fin142_held_out.json
    untuk kasus generalisasi tambahan).
