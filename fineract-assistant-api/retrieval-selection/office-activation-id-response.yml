info:
  name: response contoh Indonesia office activation
  type: http
  seq: 13

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{officeActivationIdJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{retrievalSelectionToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        // FIN-145 — poll berbasis hitungan (FIN-136) habis tanpa jeda `--delay`
        // sama seperti FIN-138; diseragamkan ke lib/poll.js (batas WAKTU 90 s).
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          const document = res.getBody().data;
          test("FIN-136: contoh Indonesia 'Kantor dengan aktivasi nasabah baru terbanyak.' tetap memilih client_activation_top_n_offices (jalur non-Inggris tidak regresi)", function () {
            expect(res.getStatus()).to.equal(200);
            expect(document.evidence_json.lineage[0].capability_id).to.equal("client_activation_top_n_offices");
          });
        }
