info:
  name: response paraphrase withdrawal top-n
  type: http
  seq: 4

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{withdrawalParaphraseJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{retrievalSelectionToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        // FIN-145 — poll berbasis hitungan (FIN-136) habis tanpa jeda `--delay`
        // sama seperti FIN-138; diseragamkan ke lib/poll.js (batas WAKTU 90 s).
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          const document = res.getBody().data;
          test("FIN-136: paraphrase 'Top withdrawals per month in the last 12 months.' memilih savings_withdrawal_monthly_top_n, bukan client_activation_top_n_offices", function () {
            expect(res.getStatus()).to.equal(200);
            expect(document.evidence_json.lineage[0].capability_id).to.equal("savings_withdrawal_monthly_top_n");
          });
        }
