info:
  name: session manifest example client lifecycle
  type: http
  seq: 8

http:
  method: post
  url: "{{baseUrl}}/chat/sessions"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{retrievalSelectionToken}}"
  body:
    type: json
    data: |
      { "title": "retrieval-selection client lifecycle" }

runtime:
  scripts:
    - type: tests
      code: |
        test("201", function () { expect(res.getStatus()).to.equal(201); });
        bru.setVar("clientLifecycleSessionId", res.getBody().data.id);
