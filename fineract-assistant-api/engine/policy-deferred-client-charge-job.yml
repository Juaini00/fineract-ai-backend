info:
  name: "OVR-6.6 gap intent (client loan account roster, CLI-5) — job"
  type: http
  seq: 38.9971
  description: |
    FIN-113: client charge assessments and payment allocations (D04) are now approved
    capabilities; client loan account roster stays a `gap_intents` entry of
    `knowledge/domains/client.yaml` (CLI-5): it answers Unsupported with `domain_gap`.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_client_charge_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the client loan account roster for this client.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_client_charge_key", "fin153-deferred-client-charge-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_client_charge_job", res.getBody().data.job_id);
