info:
  name: "OVR-6.6 domain deferred (loan, EN) — response"
  type: http
  seq: 38.923
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{policy_deferred_loan_job}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const document = res.getBody().data;
        test("OVR-6.6 (deferred, loan EN): limitation, tanpa lineage sumber", function () {
          expect(res.getStatus()).to.equal(200);
          expect(document.kind).to.equal("limitation");
          expect(document.outcome).to.equal("Unsupported");
          expect(document.completeness).to.equal("Unknown");
          expect(document.blocks_json[0].block_id).to.equal("domain_deferred");
          expect(document.evidence_json.lineage === undefined || document.evidence_json.lineage.length === 0).to.equal(true);
        });
