info:
  name: "OVR-6.6 penyempitan sah — job"
  type: http
  seq: 40
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_narrow_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the savings portfolio summary.", "office_ids": [1] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_narrow_key", "fin58-narrow-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_narrow_job", res.getBody().data.job_id);
