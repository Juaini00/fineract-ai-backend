info:
  name: "OVR-6.6 domain gap (group/center account, di luar savings, CLI-4) — job state"
  type: http
  seq: 38.996
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{policy_deferred_group_center_job}}"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const job = res.getBody().data;
        test("OVR-6.6/FIN-117 (gap, group/center CLI-4 account summary): Completed + Unsupported + Unknown, tanpa plan", function () {
          expect(res.getStatus()).to.equal(200);
          expect(job.lifecycle).to.equal("Completed");
          expect(job.outcome).to.equal("Unsupported");
          expect(job.completeness).to.equal("Unknown");
          expect(job.completeness_reason).to.equal("domain_gap");
          expect(job.completeness_reason).to.not.equal("domain_conditional_not_enabled");
          expect(job.completeness_reason).to.not.equal("surface_not_approved");
          expect(job.completeness_reason).to.not.equal("out_of_scope");
          expect(job.completeness_reason).to.not.equal("retrieval_miss");
          expect(job.plan_version).to.equal(null);
        });
