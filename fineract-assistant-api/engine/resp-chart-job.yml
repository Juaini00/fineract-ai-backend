info:
  name: FIN-65 deret waktu setoran bulanan
  type: http
  seq: 50.1
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{chartIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{respSessionId}}",
        "request_text": "Monthly deposit totals from November 2025 to September 2026."
      }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("chartIdemKey", "bruno-chartIdemKey-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("FIN-65 deret waktu setoran bulanan: job diterima", function () { expect(res.getStatus()).to.equal(202); });
        bru.setVar("chartJobId", res.getBody().data.job_id);
