info:
  name: "OVR-6.6 domain gap (inter-office cash transaction, D15e) — job"
  type: http
  seq: 38.9979
  description: |
    Inter-office cash (D15e, `gap_intents` di `knowledge/domains/teller_cashier.yaml`,
    FIN-153) — di bawah D06/accounting per disposisi D15.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_office_transaction_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the inter-office cash transaction between these branches.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_office_transaction_key", "fin153-deferred-office-transaction-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_office_transaction_job", res.getBody().data.job_id);
