info:
  name: "OVR-6.6 domain gap (family member detail, D15d) — job"
  type: http
  seq: 38.9977
  description: |
    Family member detail (D15d, `gap_intents` di `knowledge/domains/client.yaml`,
    FIN-153) — selektif/tidak-default, sama pola dengan CLI-6/CLI-8.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_family_member_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the family member detail for this client.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_family_member_key", "fin153-deferred-family-member-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_family_member_job", res.getBody().data.job_id);
