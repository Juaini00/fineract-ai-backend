info:
  name: FIN-65 top 100 setoran per bulan
  type: http
  seq: 50.3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{largeIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{respSessionId}}",
        "request_text": "Top 100 deposits per month from November 2025 to September 2026."
      }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("largeIdemKey", "bruno-largeIdemKey-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("FIN-65 top 100 setoran per bulan: job diterima", function () { expect(res.getStatus()).to.equal(202); });
        bru.setVar("largeJobId", res.getBody().data.job_id);
