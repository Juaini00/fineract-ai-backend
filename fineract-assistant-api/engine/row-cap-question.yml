info:
  name: FIN-133 pertanyaan aktivitas tabungan satu nasabah
  type: http
  seq: 28
  description: |
    `savings_client_activity` mendeklarasikan `limit: unbounded` + `hard_cap: 100`
    tanpa `defaults.default_limit`: planner mengikat row cap 100 (SQL menerima
    101 untuk mendeteksi kelebihan baris).
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{rowCapIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{rowCapSessionId}}",
        "request_text": "Show savings activity for a client."
      }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("rowCapIdemKey", "bruno-fin133-row-cap-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("FIN-133: job diterima", function () { expect(res.getStatus()).to.equal(202); });
        bru.setVar("rowCapJobId", res.getBody().data.job_id);
