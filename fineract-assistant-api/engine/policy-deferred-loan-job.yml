info:
  name: "OVR-6.6 domain deferred (loan, EN) — job"
  type: http
  seq: 38.92
  description: |
    Domain `loan` is `approved_mvp` since FIN-108 (identity, lifecycle, terms,
    schedule, transactions, charges, balances, arrears), but
    `loans_identity`/`loans_servicing`/`loans_charges_balances` do not cover
    loan disbursement (LOAN-4, area `loans`, still `gap`). This subject keeps
    proving the domain-gap guard now that "Show loan charges." is answered —
    see answers/loans/loan_charges-answer.yml.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_loan_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show loan disbursement details.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_loan_key", "fin140-deferred-loan-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_loan_job", res.getBody().data.job_id);
