info:
  name: "OVR-6.6 domain deferred (loan, EN) — job"
  type: http
  seq: 38.92
  description: |
    Domain `loan` berstatus `deferred` (`knowledge/domains/loan.yaml`) — `default_rules`:
    "respond as unsupported with a deferred reason". Sebelum FIN-140 pertanyaan baca ini tidak
    ditolak dan jatuh ke capability savings terdekat, dijawab Answered dengan data yang salah
    subjeknya (savings, bukan loan).
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_loan_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show loan transactions.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_loan_key", "fin140-deferred-loan-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_loan_job", res.getBody().data.job_id);
