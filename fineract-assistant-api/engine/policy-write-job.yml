info:
  name: "OVR-6.6 perintah tulis — job"
  type: http
  seq: 37
  description: |
    Jarvis read-only terhadap Fineract. Perintah mengubah data ditolak sebelum retrieval — sebelum FIN-139
    ia jatuh ke `client_list_recent` dan dijawab Answered/Complete.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_write_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Delete all clients.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_write_key", "fin58-write-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_write_job", res.getBody().data.job_id);
