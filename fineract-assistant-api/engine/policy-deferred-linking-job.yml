info:
  name: "OVR-6.6 domain gap (linking resources, LINK-4) — job"
  type: http
  seq: 38.9987
  description: |
    Domain `linking_resources` (`knowledge/domains/linking_resources.yaml`, gap,
    FIN-153) — actual account transfer (LINK-4) cakupannya disepakati tanpa
    capability disetujui.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_linking_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the actual account transfer between these two accounts.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_linking_key", "fin153-deferred-linking-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_linking_job", res.getBody().data.job_id);
