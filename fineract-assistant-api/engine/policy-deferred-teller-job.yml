info:
  name: "OVR-6.6 gap intent (teller/cashier cash reconciliation, D06) — job"
  type: http
  seq: 38.9989
  description: |
    FIN-115: teller/cashier assignments and recorded movements are now approved
    capabilities; cash reconciliation (counted cash vs recorded) stays a
    `gap_intents` entry of `knowledge/domains/teller_cashier.yaml` (D06): no
    reconciliation record is read, so it answers Unsupported with `domain_gap`.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_teller_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the cash reconciliation for this teller.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_teller_key", "fin153-deferred-teller-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_teller_job", res.getBody().data.job_id);
