info:
  name: response analysis dengan lineage
  type: http
  seq: 10

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{answeredJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const document = res.getBody().data;
        const blocks = document.blocks_json;

        test("kind analysis, bukan limitation", function () {
          expect(res.getStatus()).to.equal(200);
          expect(document.kind).to.equal("analysis");
          expect(document.completeness).to.equal("Complete");
        });

        test("saldo per mata uang datang sebagai satu blok table, bukan metric gabungan", function () {
          // L1.1 (#14) — `savings.balance_summary` ber-grain [currency_code]:
          // satu baris per mata uang, tidak pernah dijumlah lintas AED/EUR/USD.
          // Lebih dari satu baris → blok `table` (§2); satu blok `metric`
          // `total_balance` di sini berarti mata uang dijumlah — regresi L1.1.
          const tables = blocks.filter((b) => b.type === "table");
          expect(tables).to.have.lengthOf(1);
          const table = tables[0];
          expect(table.block_id).to.be.a("string");
          expect(table.schema_version).to.equal(1);
          expect(table.derived_from).to.be.an("array").that.is.not.empty;
          expect(table.columns).to.deep.equal([
            "currency_code",
            "account_count",
            "total_balance",
            "average_balance",
            "max_balance",
          ]);
          expect(table.row_count).to.equal(table.rows.length);
          expect(table.rows.length).to.be.above(1);
          const currencies = table.rows.map((row) => row[0]);
          expect(new Set(currencies).size).to.equal(currencies.length);
          expect(blocks.filter((b) => b.type === "metric")).to.have.lengthOf(0);
          expect(blocks.find((b) => b.type === "metrics")).to.equal(undefined);
          expect(blocks.find((b) => b.type === "provenance")).to.equal(undefined);
        });

        test("lineage hidup di evidence_json, bukan di blok", function () {
          // §6.2 / #10 — provenance pindah ke evidence_json.lineage.
          const lineage = document.evidence_json.lineage[0];
          expect(lineage.capability_id).to.equal("savings_balance_summary");
          expect(lineage.query_id).to.equal("savings.balance_summary");
          expect(lineage.sql_file).to.be.a("string");
          expect(lineage.catalog_content_hash).to.have.lengthOf(64);
          // Scope dilaporkan sebagai jumlah office, bukan daftar id.
          const scope = lineage.parameters.find((p) => p.name === "office_ids");
          expect(scope.value).to.match(/authorized offices$/);
        });
