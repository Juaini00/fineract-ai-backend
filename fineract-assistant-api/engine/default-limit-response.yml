info:
  name: FIN-133 default_limit adalah ukuran jawaban, bukan pemotongan
  type: http
  seq: 35
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{defaultLimitJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const document = res.getBody().data;
        const blocks = document.blocks_json;
        const lineage = document.evidence_json.lineage[0];

        test("FIN-133: capability client_random_sample menjawab", function () {
          expect(res.getStatus()).to.equal(200);
          expect(document.kind).to.equal("analysis");
          expect(document.outcome).to.equal("Answered");
          expect(lineage.capability_id).to.equal("client_random_sample");
        });

        test("FIN-133: 5 baris, Complete, tanpa blok row_cap_reached", function () {
          const table = blocks.find(function (b) { return b.type === "table"; });
          expect(table.rows).to.have.lengthOf(5);
          expect(document.completeness).to.equal("Complete");
          expect(blocks.find(function (b) { return b.block_id === "row_cap_reached"; })).to.equal(undefined);
        });

        test("FIN-133: lineage mencatat limit = default_limit (5)", function () {
          const limit = lineage.parameters.find(function (p) { return p.name === "limit"; });
          expect(limit.value).to.equal(5);
        });
