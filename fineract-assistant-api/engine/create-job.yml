info:
  name: create job
  type: http
  seq: 3

http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{engineIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{engineSessionId}}",
        "request_text": "berapa total portfolio aktif bulan ini?"
      }

runtime:
  scripts:
    - type: before-request
      code: |
        const unique = String(Date.now()) + Math.random().toString(36).slice(2, 10);
        bru.setVar("engineIdemKey", "bruno-engine-" + unique);
    - type: tests
      code: |
        test("202 dan acknowledgement menyebut Queued", function () {
          expect(res.getStatus()).to.equal(202);
          // 202 berarti diterima secara durable — bukan bahwa worker sudah
          // mengerjakannya.
          expect(res.getBody().data.lifecycle).to.equal("Queued");
        });
        bru.setVar("engineJobId", res.getBody().data.job_id);
