info:
  name: "FIN-126 D13 — list Fineract report definitions — job"
  type: http
  seq: 51.8
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{fin126_list_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "List Fineract reports including report X as Jarvis analysis.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("fin126_list_key", "fin126-list-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("FIN-126 (D13, list): job diterima", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("fin126_list_job", res.getBody().data.job_id);
