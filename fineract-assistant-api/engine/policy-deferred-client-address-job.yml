info:
  name: "OVR-6.6 domain gap (family member detail, D15d) — job"
  type: http
  seq: 38.98
  description: |
    FIN-128: client address (CLI-6) is now an approved capability (`client_address`).
    Family member detail (D15d, `knowledge/domains/client.yaml` `gap_intents`) remains
    selective/gap: it answers `Unsupported` with `domain_gap`.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_client_address_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the family member detail for this client.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_client_address_key", "fin153-deferred-client-address-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_client_address_job", res.getBody().data.job_id);
