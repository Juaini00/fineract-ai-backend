info:
  name: assertion retrieval saldo kantor Indonesia
  type: http
  seq: 20
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{indonesianOfficeBalanceJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        // FIN-146 — dibaca langsung sesudah create-job, tanpa poll job-state.
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          test("FIN-40: saldo kantor Indonesia memilih capability terindeks", function () {
            expect(res.getStatus()).to.equal(200);
            expect(res.getBody().data.evidence_json.lineage[0].capability_id)
              .to.equal("organization_office_savings_summary");
          });
        }
