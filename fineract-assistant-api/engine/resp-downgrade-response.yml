info:
  name: RESP-8.7 chart tidak kompatibel turun menjadi tabel + note
  type: http
  seq: 50.7
  description: |
    responses.md §7 / RESP-8.7 — capability yang sama mendeklarasikan chart
    time_series, tetapi satu bulan hanya memberi satu titik pada sumbu waktu.
    Chart tidak dirender: yang tersaji `table` + `note`, jawabannya tetap
    `Answered`/`Complete` dan lolos validator — bukan gagal, bukan menyesatkan.
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{downgradeJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          const document = res.getBody().data;
          const blocks = document.blocks_json;
          const lineage = document.evidence_json.lineage[0];
          const table = blocks.find(function (b) { return b.type === "table"; });
          const note = blocks.find(function (b) { return b.block_id === "chart_downgraded"; });

          test("RESP-8.7: capability ber-chart atas periode yang hanya punya satu bulan data", function () {
            expect(res.getStatus()).to.equal(200);
            expect(lineage.capability_id).to.equal("savings_deposit_monthly_breakdown");
            const from = lineage.parameters.find(function (p) { return p.name === "from_date"; });
            const to = lineage.parameters.find(function (p) { return p.name === "to_date"; });
            expect(from.value.slice(0, 7)).to.equal("2026-06");
            expect(to.value.slice(0, 7)).to.equal("2026-09");
          });

          test("RESP-8.7: chart tidak kompatibel turun menjadi table + note, tanpa chart_spec", function () {
            expect(blocks.find(function (b) { return b.type === "chart_spec"; })).to.equal(undefined);
            expect(table, "blok table").to.be.an("object");
            const at = table.columns.indexOf("month_start");
            expect(new Set(table.rows.map(function (r) { return r[at]; })).size).to.equal(1);
            expect(note.type).to.equal("note");
            expect(note.downgraded_from).to.equal("chart_spec");
            expect(note.reason).to.equal("the result has fewer than two points on the time dimension");
            expect(note.body).to.contain("not rendered");
          });

          test("RESP-8.7: downgrade bukan kegagalan — Answered, Complete, validator passed", function () {
            expect(document.outcome).to.equal("Answered");
            expect(document.completeness).to.equal("Complete");
            expect(document.validation_status).to.equal("passed");
          });
        }
