info:
  name: "OVR-6.6 domain gap (reproduce published report, D01) — job"
  type: http
  seq: 38.9981
  description: |
    D01 (period-close, recomputed-only — dataset-scope-decisions.md:16 fixes this;
    reproduce-exact-as-published is out of scope) — `gap_intents` di
    `knowledge/domains/savings.yaml`/`loan.yaml`, FIN-153. Kontrol atas
    savings/loan yang sudah punya capability aktif tetap tidak boleh menjawab
    permintaan "reproduce the published report" seolah itu recomputasi biasa.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_d01_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Reproduce the published report for last month.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_d01_key", "fin153-deferred-d01-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_d01_job", res.getBody().data.job_id);
