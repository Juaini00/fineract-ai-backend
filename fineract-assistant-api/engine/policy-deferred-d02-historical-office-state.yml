info:
  name: "OVR-6.6 domain gap (historical office as of a past date, D02) — job state"
  type: http
  seq: 38.9984
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{policy_deferred_d02_job}}"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, function (job) { return poll.TERMINAL.includes(job.lifecycle); })) {
          const job = res.getBody().data;
          test("OVR-6.6/FIN-153 (gap, D02 historical office): Completed + Unsupported + Unknown, tanpa plan", function () {
            expect(res.getStatus()).to.equal(200);
            expect(job.lifecycle).to.equal("Completed");
            expect(job.outcome).to.equal("Unsupported");
            expect(job.completeness).to.equal("Unknown");
            expect(job.completeness_reason).to.equal("domain_gap");
            expect(job.completeness_reason).to.not.equal("surface_not_approved");
            expect(job.completeness_reason).to.not.equal("out_of_scope");
            expect(job.completeness_reason).to.not.equal("retrieval_miss");
            expect(job.plan_version).to.equal(null);
          });
        }
