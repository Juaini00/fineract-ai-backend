info:
  name: response document
  type: http
  seq: 5

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{engineJobId}}/response"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const document = res.getBody().data;

        test("200 dan response durable", function () {
          expect(res.getStatus()).to.equal(200);
          expect(document.response_version).to.equal(1);
          expect(document.validation_status).to.equal("passed");
          expect(document.response_hash).to.have.lengthOf(64);
        });

        test("FIN-40: response menunjukkan lineage capability portfolio", function () {
          expect(document.kind).to.equal("analysis");
          expect(document.completeness).to.equal("Complete");
          const lineage = document.evidence_json.lineage[0];
          expect(lineage.capability_id).to.equal("savings_balance_summary");
          expect(lineage.query_id).to.equal("savings.balance_summary");
        });
