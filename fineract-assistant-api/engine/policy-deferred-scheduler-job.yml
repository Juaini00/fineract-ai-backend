info:
  name: "OVR-6.6 domain gap (scheduler, D14) — job"
  type: http
  seq: 38.9995
  description: |
    Domain `scheduler` (`knowledge/domains/scheduler.yaml`, gap, FIN-153) — D14
    cakupannya disepakati tanpa capability disetujui.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_scheduler_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the batch job status for interest posting last night.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_scheduler_key", "fin153-deferred-scheduler-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_scheduler_job", res.getBody().data.job_id);
