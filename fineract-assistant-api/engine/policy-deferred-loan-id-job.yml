info:
  name: "OVR-6.6 domain deferred (loan, ID) — job"
  type: http
  seq: 38.93
  description: |
    Padanan Indonesia dari subjek loan yang masih gap — biaya pinjaman
    (LOAN-7), bukan transaksi (LOAN-6, sudah Answered sejak FIN-108).
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_loan_id_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Tampilkan biaya pinjaman bulan ini.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_loan_id_key", "fin140-deferred-loan-id-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_loan_id_job", res.getBody().data.job_id);
