info:
  name: job diselesaikan worker
  type: http
  seq: 4

http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{engineJobId}}"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const job = res.getBody().data;

        test("job mencapai state terminal tanpa campur tangan klien", function () {
          expect(res.getStatus()).to.equal(200);
          expect(job.lifecycle).to.equal("Completed");
          expect(job.terminal_at).to.be.a("string");
        });

        test("FIN-40: Completed + Answered adalah hasil retrieval portfolio", function () {
          expect(job.outcome).to.equal("Answered");
          expect(job.completeness).to.equal("Complete");
          expect(job.final_response_version).to.equal(1);
        });

        test("cursor event mencatat accepted, planning, node, dan completed", function () {
          expect(job.last_event_sequence).to.equal(5);
        });
