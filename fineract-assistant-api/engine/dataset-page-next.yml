info:
  name: DS-8.3 halaman lanjutan sampai habis
  type: http
  seq: 13.2
  description: |
    DS-8.3 — mengikuti `next_cursor` sampai `null`. Request ini diulang lewat
    `bru.setNextRequest` selama masih ada halaman, lalu seluruh halaman yang
    dikumpulkan harus sama persis — isi dan urutan — dengan satu pembacaan
    penuh.

http:
  method: get
  url: "{{baseUrl}}/chat/datasets/{{answeredDatasetId}}/rows?limit=1&cursor={{datasetPage2Cursor}}"
  headers:
    - name: authorization
      value: "Bearer {{engineToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        const page = res.getBody().data;
        const collected = JSON.parse(bru.getVar("datasetPagedRows")).concat(page.rows);
        bru.setVar("datasetPagedRows", JSON.stringify(collected));

        test("DS-8.3: tiap halaman memuat satu baris", function () {
          expect(res.getStatus()).to.equal(200);
          expect(page.rows).to.have.lengthOf(1);
        });

        if (page.next_cursor) {
          bru.setVar("datasetPage2Cursor", page.next_cursor);
          bru.setNextRequest("DS-8.3 halaman lanjutan sampai habis");
        } else {
          test("DS-8.3: gabungan halaman = satu pembacaan penuh, urutan tidak berubah", function () {
            const columns = JSON.parse(bru.getVar("answeredTableColumns"));
            const full = JSON.parse(bru.getVar("answeredTableRows"));
            const paged = collected.map((row) => columns.map((column) => row[column]));
            expect(paged).to.deep.equal(full);
            expect(collected).to.have.lengthOf(Number(bru.getVar("answeredRowCount")));
          });
        }
