info:
  name: "OVR-6.6 domain gap (group meeting attendance, D08) — job"
  type: http
  seq: 38.9997
  description: |
    Domain `group_center` (`knowledge/domains/group_center.yaml`) — FIN-117
    membangun capability D08 untuk jadwal pertemuan
    (`group_center_meeting_schedule`), tetapi realisasi/kehadiran tetap tanpa
    capability: `m_meeting`/`m_client_attendance` diverifikasi 0 baris pada
    deployment ini (knowledge/VERIFICATION.md). Sebuah entri kalender tidak
    pernah dilaporkan sebagai bukti pertemuan terjadi atau dihadiri.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_group_meeting_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the group meeting attendance for this center.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_group_meeting_key", "fin153-deferred-group-meeting-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_group_meeting_job", res.getBody().data.job_id);
