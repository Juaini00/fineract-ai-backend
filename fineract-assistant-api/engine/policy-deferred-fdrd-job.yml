info:
  name: "OVR-6.6 gap intent (FD/RD schedule, FDRD-9) — job"
  type: http
  seq: 38.9985
  description: |
    FIN-110: RD contributions (FDRD-8) are now approved; recurring deposit
    installment schedule stays a `gap_intents` entry of
    `knowledge/domains/fixed_recurring_deposit.yaml` (FDRD-9): it answers
    Unsupported with `domain_gap`.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_fdrd_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the recurring deposit installment schedule for this account.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_fdrd_key", "fin153-deferred-fdrd-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_fdrd_job", res.getBody().data.job_id);
