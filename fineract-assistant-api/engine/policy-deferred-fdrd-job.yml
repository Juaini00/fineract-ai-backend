info:
  name: "OVR-6.6 domain gap (FD/RD, FDRD-8) — job"
  type: http
  seq: 38.9985
  description: |
    Domain `fixed_recurring_deposit` (`knowledge/domains/fixed_recurring_deposit.yaml`,
    gap, FIN-153) — RD contribution (FDRD-8) cakupannya disepakati tanpa capability
    disetujui.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_fdrd_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the recurring deposit contribution for this account.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_fdrd_key", "fin153-deferred-fdrd-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_fdrd_job", res.getBody().data.job_id);
