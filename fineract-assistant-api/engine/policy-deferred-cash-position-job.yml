info:
  name: "OVR-6.6 gap intent (physical cash count, D06) — job"
  type: http
  seq: 38.9979
  description: |
    FIN-115: counted physical cash is a `gap_intents` entry of
    `knowledge/domains/teller_cashier.yaml` (D06): no counted-cash record is read.
    The RECORDED cash position and inter-office cash (D15e) are approved
    capabilities now.
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{engineToken}}"
    - name: Idempotency-Key
      value: "{{policy_deferred_cash_position_key}}"
  body:
    type: json
    data: |
      { "session_id": "{{policySession}}", "request_text": "Show the physical cash count for this teller.", "office_ids": [] }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("policy_deferred_cash_position_key", "fin115-deferred-cash-position-" + Date.now() + Math.random().toString(36).slice(2, 10));
    - type: tests
      code: |
        test("202 — permintaan diterima; penolakannya keputusan Engine, bukan intake", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("policy_deferred_cash_position_job", res.getBody().data.job_id);
