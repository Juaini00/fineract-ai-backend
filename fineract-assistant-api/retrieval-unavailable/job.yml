info:
  name: known capability paraphrase while semantic retrieval is unavailable
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{retrievalUnavailableToken}}"
    - name: Idempotency-Key
      value: "{{retrievalUnavailableKey}}"
  body:
    type: json
    data: |
      { "session_id": "{{retrievalUnavailableSession}}", "request_text": "Akumulasi dana masuk anggota selama siklus berjalan" }
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("retrievalUnavailableKey", "retrieval-unavailable-" + Date.now());
    - type: tests
      code: |
        expect(res.getStatus()).to.equal(202);
        bru.setVar("retrievalUnavailableJob", res.getBody().data.job_id);
