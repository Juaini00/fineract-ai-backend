info:
  name: unavailable retrieval is disclosed as retrieval miss
  type: http
  seq: 4
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{retrievalUnavailableJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{retrievalUnavailableToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        // FIN-134 — response baru ada sesudah job settle; semantic arm memanggil
        // API embedding sehingga latensinya bisa melewati jeda runner. Tunggu
        // (dibatasi), jangan membaca 404 sebagai jawaban.
        const polls = Number(bru.getVar("retrievalUnavailablePolls") || 0);
        if (res.getStatus() === 404 && polls < 20) {
          bru.setVar("retrievalUnavailablePolls", polls + 1);
          bru.setNextRequest(req.getName());
        } else {
          const document = res.getBody().data;
          test("FIN-42: unavailable semantic arm is retrieval_miss", function () {
            expect(res.getStatus()).to.equal(200);
            expect(document.kind).to.equal("limitation");
            expect(document.outcome).to.equal("Unsupported");
            expect(document.completeness).to.equal("Unknown");
            expect(document.completeness_reason).to.equal("retrieval_miss");
          });
        }
