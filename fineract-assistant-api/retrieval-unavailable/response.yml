info:
  name: unavailable retrieval is disclosed as retrieval miss
  type: http
  seq: 4
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{retrievalUnavailableJob}}/response"
  headers:
    - name: authorization
      value: "Bearer {{retrievalUnavailableToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        // FIN-138 — poll berbasis hitungan (FIN-134) habis dalam ~puluhan ms
        // karena setNextRequest mengulang tanpa jeda `--delay`. Tidak flaky di
        // sini (arm semantik dimatikan, job selesai cepat) tapi pola yang sama
        // flaky di retrieval-vector/retrieval-healthy — diseragamkan ke
        // lib/poll.js (batas WAKTU 90 s, tidur per-poll) yang sudah dipakai FIN-141.
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, () => true)) {
          const document = res.getBody().data;
          test("FIN-42: unavailable semantic arm is retrieval_miss", function () {
            expect(res.getStatus()).to.equal(200);
            expect(document.kind).to.equal("limitation");
            expect(document.outcome).to.equal("Unsupported");
            expect(document.completeness).to.equal("Unknown");
            expect(document.completeness_reason).to.equal("retrieval_miss");
          });
        }
