info:
  name: accept Indonesian planner request
  type: http
  seq: 3
http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{plannerToken}}"
    - name: Idempotency-Key
      value: "{{plannerIdem}}"
  body:
    type: json
    data: |
      {"session_id":"{{plannerSession}}","request_text":"Total setoran tabungan bulan ini"}
runtime:
  scripts:
    - type: before-request
      code: |
        bru.setVar("plannerIdem", "bruno-planner-" + Date.now() + Math.random().toString(36).slice(2));
    - type: tests
      code: |
        test("planner job accepted durably", function () { expect(res.getStatus()).to.equal(202); });
        bru.setVar("plannerJob", res.getBody().data.job_id);
