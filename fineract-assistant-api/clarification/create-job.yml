info:
  name: pertanyaan yang kekurangan input
  type: http
  seq: 3

http:
  method: post
  url: "{{baseUrl}}/chat/jobs"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{clarifyToken}}"
    - name: Idempotency-Key
      value: "{{clarifyIdemKey}}"
  body:
    type: json
    data: |
      {
        "session_id": "{{clarifySessionId}}",
        "request_text": "Find clients whose display name matches a person name."
      }

runtime:
  scripts:
    - type: before-request
      code: |
        const unique = String(Date.now()) + Math.random().toString(36).slice(2, 10);
        bru.setVar("clarifyIdemKey", "bruno-clarify-" + unique);
    - type: tests
      code: |
        test("202", function () {
          expect(res.getStatus()).to.equal(202);
        });
        bru.setVar("clarifyJobId", res.getBody().data.job_id);
