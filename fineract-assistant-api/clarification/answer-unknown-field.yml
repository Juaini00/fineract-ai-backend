info:
  name: jawaban untuk field yang tidak pernah ditanyakan
  type: http
  seq: 6

http:
  method: post
  url: "{{baseUrl}}/chat/jobs/{{clarifyJobId}}/responses"
  headers:
    - name: content-type
      value: application/json
    - name: authorization
      value: "Bearer {{clarifyToken}}"
    - name: Idempotency-Key
      value: "{{clarifyIdemKey}}-unknown"
  body:
    type: json
    data: |
      {
        "clarification_id": "{{clarificationId}}",
        "revision": 1,
        "answers": { "office_ids": "1,2,3" }
      }

runtime:
  scripts:
    - type: tests
      code: |
        test("API-5 — field asing ditolak 422 dengan error tersanitasi, bukan diabaikan", function () {
          // API-5: input tidak valid → 4xx tersanitasi. Menerimanya berarti klien dapat
          // menyuntikkan parameter — termasuk scope — yang tidak pernah ditanyakan.
          // (State tak-bermutasi dibuktikan di refresh-form.yml sesudah submit ini.)
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody().error.code).to.equal("INVALID");
          expect(res.getBody().error.message).to.include("Unknown field");
          // Tidak ada SQL/prompt/stack yang bocor.
          expect(res.getBody().error.message).to.not.match(/SELECT|m_savings|\.sql/);
        });
