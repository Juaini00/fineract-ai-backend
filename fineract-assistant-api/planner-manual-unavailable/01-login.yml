info:
  name: manual planner login
  type: http
  seq: 1
http:
  method: post
  url: '{{baseUrl}}/auth/login'
  headers:
  - name: content-type
    value: application/json
  body:
    type: json
    data: '{"username":"{{username}}","password":"{{password}}"}'
runtime:
  scripts:
  - type: tests
    code: 'test("local principal authenticated", () => expect(res.getStatus()).to.equal(200));

      bru.setVar("manualPlannerToken", res.getBody().data.access_token);'
