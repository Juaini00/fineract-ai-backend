name: local

variables:
  # Port default 3007 bentrok dengan backend repo lama pada mesin dev; runner
  # menimpanya lewat --env-var baseUrl=... sesuai APP_PORT yang dipakai.
  - name: baseUrl
    value: http://127.0.0.1:3007
  # Kredensial seed bootstrap admin (AUTH_BOOTSTRAP_ADMIN_*), hanya berlaku di
  # APP_ENV=local. Bukan rahasia produksi.
  - name: username
    value: admin
  - name: password
    value: password123
