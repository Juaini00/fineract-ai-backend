info:
  name: snapshot job dari PostgreSQL
  type: http
  seq: 6
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{redisDownJob}}"
  headers:
    - name: authorization
      value: "Bearer {{redisDownToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const job = res.getBody().data;
        test("OVR-6.5: disconnect bukan cancel — job Completed/Answered, bukan Cancelling/Cancelled", function () {
          expect(res.getStatus()).to.equal(200);
          expect(job.lifecycle).to.equal("Completed");
          expect(job.outcome).to.equal("Answered");
          expect(job.failure_code).to.equal(null);
        });
        bru.setVar("redisDownLastSequence", job.last_event_sequence);
        bru.setVar("redisDownResponseVersion", job.final_response_version);
