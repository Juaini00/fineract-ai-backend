info:
  name: job ditutup Cancelled
  type: http
  seq: 10
http:
  method: get
  url: "{{baseUrl}}/chat/jobs/{{skipCancelJob}}"
  headers:
    - name: authorization
      value: "Bearer {{workerErrorToken}}"
runtime:
  scripts:
    - type: tests
      code: |
        const poll = require("./lib/poll.js");
        if (await poll.awaitJob(bru, req, res, function (job) { return poll.TERMINAL.includes(job.lifecycle); })) {
          const job = res.getBody().data;
          test("OVR-6.4 (FIN-144): job ditutup Cancelled/Unknown", function () {
            expect(job.lifecycle).to.equal("Cancelled");
            expect(job.outcome).to.equal("Cancelled");
            expect(job.completeness).to.equal("Unknown");
            expect(job.completeness_reason).to.equal("cancelled_by_user");
          });
          bru.setVar("skipCancelLastSequence", job.last_event_sequence);
        }
